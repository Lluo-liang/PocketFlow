# 🤖 工作流托管需求判断引擎
workflow_hosting_decision_engine:
  # 判断标准定义
  task_master_hosting_criteria:
    # 需要Task-Master托管的指标
    requires_hosting_if:
      complex_multi_stage: "包含≥3个复杂执行阶段"
      state_management_needed: "需要跨阶段状态保持和管理"
      constraint_enforcement: "需要严格约束验证和执行控制"
      task_decomposition: "需要智能任务分解和协调"
      quality_gates: "包含质量门禁和验证流程"
      file_operations: "需要代码生成、文件操作、构建执行"
      dependency_management: "复杂的依赖关系管理"

    # 不需要Task-Master托管的指标
    no_hosting_if:
      pure_analysis: "纯分析类工作流，无具体执行任务"
      interactive_guidance: "主要是交互式引导和选择"
      meta_workflow: "元工作流，用于生成其他工作流"
      simple_reporting: "简单的报告生成和信息整理"
      ai_internal_process: "AI编程工具内部处理流程"

  # 智能判断算法
  decision_algorithm:
    scoring_method: "user_preference_priority + weighted_criteria_analysis"

    # 优先级规则
    priority_rules:
      user_explicit_choice: 1.0       # 用户明确选择权重最高
      automatic_analysis: 0.3         # 自动分析权重较低

    # 用户选择处理
    user_choice_handling:
      interactive_guidance_selected:
        hosting_decision: "no_hosting"
        confidence: 0.95
        override_analysis: true

      automated_execution_selected:
        hosting_decision: "hosting_required"
        confidence: 0.95
        override_analysis: true

      hybrid_approach_selected:
        hosting_decision: "conditional"
        confidence: 0.7
        requires_complexity_analysis: true

    # 自动分析权重配置（仅在用户未明确选择或选择混合模式时使用）
    criteria_weights:
      execution_complexity: 0.25      # 执行复杂度
      state_persistence: 0.20         # 状态持久化需求
      constraint_requirements: 0.20   # 约束需求
      tool_coordination: 0.15         # 工具协调需求
      file_system_operations: 0.15    # 文件系统操作
      user_interaction_type: 0.05     # 用户交互类型

    # 判断阈值
    hosting_threshold: 0.6            # ≥0.6 需要托管
    no_hosting_threshold: 0.4         # ≤0.4 不需要托管
    # 0.4-0.6之间需要人工确认

  # 典型案例库
  reference_cases:
    needs_hosting:
      - "TDD开发流水线"
      - "CI/CD部署工作流"
      - "代码质量检查和修复"
      - "系统重构和测试"
      - "多环境发布管理"

    no_hosting:
      - "需求分析引导"
      - "工作流生成器"
      - "文档模板生成"
      - "配置向导"
      - "决策支持分析"

