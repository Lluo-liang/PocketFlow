        constraint_framework_integration_validation: "验证约束框架集成的完整性"
        # 新增：资源依赖验证
        resource_dependency_validation: "验证所有外部资源引用的可用性和准确性"
        template_reference_validation: "验证模板引用的存在性和路径正确性"
        tool_assumption_validation: "验证工作流不包含未验证的工具假设"

