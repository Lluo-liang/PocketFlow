        - compliance_indicators: "合规要求线索"
        - business_keywords: "业务关键词"
        - workflow_preferences: "流程偏好"

      categories:
        fintech:
          indicators: ["encryption", "audit", "compliance", "security"]
          requirements: ["sox_compliance", "security_audit", "data_encryption"]

        healthcare:
          indicators: ["hipaa", "patient", "medical", "phi"]
