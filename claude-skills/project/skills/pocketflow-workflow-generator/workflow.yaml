      quality_validation_checks:
        iterative_mechanism_validation: "验证是否正确配置了多轮迭代机制和反馈循环"
        verification_constraint_validation: "验证是否包含必要的强制验证约束和阻断规则"
        authority_hierarchy_validation: "验证角色权威层次和决策权限是否清晰合理"
