    template_management_strategy:
      template_selection_logic:
        requirement_analysis_workflow: "prd-requirement-analysis-report-template.mdc"
        technical_design_workflow: "technical-design-report-template.mdc"
        quality_assessment_workflow: "quality-assessment-report-template.mdc"
        security_audit_workflow: "security-audit-report-template.mdc"
        performance_optimization_workflow: "performance-optimization-report-template.mdc"

    # 报告生成流水线
    report_generation_pipeline:
      template_loading: "从domain-specific templates目录加载模板"
      variable_mapping: "映射分析结果到模板变量"
      template_rendering: "使用Handlebars引擎渲染模板"
      output_generation: "生成标准化报告文档"

    # 模板引擎配置
    template_engine_config:
      engine_type: "handlebars"
      variable_syntax: "{{variable}}"
      conditional_syntax: "{{#if condition}}"
      loop_syntax: "{{#each items}}"

    # 输出标准化
    output_standardization:
      consistent_structure: "确保报告结构一致性"
      variable_validation: "验证模板变量完整性"
      format_compliance: "确保格式规范遵循"

  # 🌐 行业知识和最佳实践引擎
