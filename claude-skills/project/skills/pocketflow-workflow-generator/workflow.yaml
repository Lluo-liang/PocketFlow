        auto_inject_patterns: ["constraint_driven_rigor", "role_authority_hierarchy_rigor", "autonomous_delegation_patterns"]
        quality_gate_enforcement: true

      maintainability_analysis:
        complexity_thresholds: ["workflow_size > 500_lines", "reusable_components", "long_term_maintenance", "modular_separation_needed"]
        triggers_modular_architecture: true
        auto_inject_patterns: ["modular_architecture_rigor", "external_component_references", "plugin_domain_separation"]
        architecture_compliance_required: true

    # 自动质量注入决策引擎
    automatic_injection_decision:
      decision_algorithm: "multi_criteria_threshold_based"

      injection_rules:
        # 规则1: 复杂分析场景自动注入迭代验证严谨性
        rule_iterative_validation:
          condition: "complexity_score > 0.7 OR business_decision_involved == true OR multi_expert_required == true"
          action: "inject_iterative_validation_rigor"
          components: ["stage_loop_mechanism", "expert_consensus_validation", "convergence_detection", "feedback_driven_refinement"]
          priority: "highest"
          cookbook_pattern_source: "intelligent-requirement-analysis-workflow-v3.yaml:stages[2-3]"

        # 规则2: 数据依赖场景自动注入强制验证约束
        rule_mandatory_verification:
          condition: "data_dependency_detected == true OR technical_decision_critical == true OR entity_modification_required == true"
          action: "inject_mandatory_verification_rigor"
          components: ["blocking_rules", "verification_checkpoints", "escalation_authority", "data_state_verification"]
          priority: "critical"
          cookbook_pattern_source: "requirement-analysis-constraint-base.yaml:mandatory_data_verification_constraints"

        # 规则3: 技术决策场景自动注入权威质疑机制
        rule_technical_authority:
          condition: "architecture_decision == true OR implementation_choice_critical == true OR data_layer_decisions == true"
          action: "inject_technical_authority_challenge_rigor"
          components: ["mandatory_challenges", "veto_authority", "alternative_evaluation", "tech_lead_blocking_power"]
          priority: "high"
          cookbook_pattern_source: "requirement-analysis-constraint-base.yaml:mandatory_technical_challenges"

        # 规则4: 企业级场景自动注入约束驱动严谨性
        rule_constraint_driven:
          condition: "enterprise_workflow == true OR compliance_required == true OR role_driven_execution == true"
          action: "inject_constraint_driven_rigor"
          components: ["strict_sequence", "state_lock_enforcement", "dependency_validation", "constraint_framework_integration"]
          priority: "high"
          cookbook_pattern_source: "intelligent-requirement-analysis-workflow-v3.yaml:constraint_driven_config"

        # 规则5: 复杂工作流自动进行模块化拆分
        rule_modular_architecture:
          condition: "workflow_complexity > 500_lines OR reusable_components_detected == true OR plugin_domain_required == true"
          action: "inject_modular_architecture_rigor"
          components: ["engine_extraction", "template_separation", "constraint_centralization", "external_component_references"]
          priority: "medium"
          cookbook_pattern_source: "intelligent-requirement-analysis-workflow-v3.yaml:architecture_references"

        # 新增规则6: 自主执行模式注入
        rule_autonomous_execution:
          condition: "role_driven_workflow == true OR minimal_user_interaction_required == true"
          action: "inject_autonomous_execution_rigor"
          components: ["delegation_model", "background_execution", "intervention_points", "autonomous_quality_assurance"]
          priority: "medium"
          cookbook_pattern_source: "intelligent-requirement-analysis-workflow-v3.yaml:execution_config"

        # 新增规则7: 业务实体感知增强
        rule_business_entity_awareness:
          condition: "code_analysis_required == true OR entity_modification_involved == true"
          action: "inject_business_entity_awareness_rigor"
          components: ["entity_discovery_engine", "chinese_annotation_support", "business_terminology_translation"]
          priority: "medium"
          cookbook_pattern_source: "business-entity-discovery-engine.yaml"

