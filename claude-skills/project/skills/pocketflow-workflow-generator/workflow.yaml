    scenario_pattern_matching:
      complexity_analysis:
        high_complexity_indicators: ["multi_stage_analysis", "expert_collaboration", "business_decisions", "iterative_feedback_loops"]
        triggers_iterative_validation: true
        auto_inject_patterns: ["iterative_validation_rigor", "expert_consensus_validation", "stage_feedback_loops"]
        complexity_threshold: 0.7

      data_dependency_analysis:
        data_critical_indicators: ["database_queries", "data_state_verification", "technical_decisions", "entity_modifications"]
        triggers_mandatory_verification: true
        auto_inject_patterns: ["mandatory_verification_rigor", "technical_authority_challenge_rigor", "blocking_constraint_rules"]
        verification_strictness: "maximum"

      quality_criticality_analysis:
        quality_critical_indicators: ["enterprise_workflows", "compliance_requirements", "production_systems", "role_driven_execution"]
