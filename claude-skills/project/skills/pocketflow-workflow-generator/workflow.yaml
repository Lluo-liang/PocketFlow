# PocketFlow 轻量级工作流生成器 - 简化版
id: pocketflow-workflow-generator
title: "PocketFlow 应用生成器"
version: "2.0-lightweight"
description: "轻量级、可迁移的 PocketFlow 应用生成器,基于 Cookbook 示例学习,生成完整的应用代码"

# ========================================
# 执行模式配置
# ========================================
execution_mode:
  type: "autonomous_code_generation"
  style: "cookbook_based_learning"
  tools_allowed: ["Read", "Write", "Edit", "Bash", "Glob", "Grep", "Task"]

# ========================================
# 依赖资源
# ========================================
requires:
  # 核心依赖
  pocketflow_framework:
    path: "pocketflow/__init__.py"
    description: "PocketFlow 核心框架"
    required: true

  cookbook_directory:
    path: "cookbook/"
    description: "Cookbook 示例目录"
    required: true
    scan_pattern: "cookbook/pocketflow-*/"

  # 可选依赖
  project_docs:
    path: "docs/"
    description: "项目文档"
    required: false

  project_tests:
    path: "tests/"
    description: "测试用例"
    required: false

# ========================================
# 工作流阶段
# ========================================
stages:
  # 阶段1: 需求分析
  - id: requirement_analysis
    title: "需求分析与意图识别"
    description: "从用户描述中提取应用类型、核心功能、输入输出等信息"
    tasks:
      - id: extract_requirements
        description: "提取用户需求的关键信息"
        actions:
          - analyze_user_input
          - identify_app_type  # Agent/Workflow/RAG/Batch 等
          - extract_core_features
          - identify_special_requirements  # 异步/批处理等
        outputs:
          - requirement_summary

  # 阶段2: Cookbook 扫描
  - id: cookbook_scanning
    title: "扫描 Cookbook 示例"
    description: "扫描 cookbook/ 目录,找到相似的参考示例"
    depends_on: [requirement_analysis]
    tasks:
      - id: scan_cookbook
        description: "列出所有 cookbook 示例"
        tools: ["Bash", "Glob"]
        actions:
          - command: "ls -la cookbook/"
          - pattern: "cookbook/pocketflow-*/"
        outputs:
          - cookbook_list

      - id: match_examples
        description: "根据应用类型匹配相关示例"
        matching_rules:
          Agent: ["pocketflow-agent", "pocketflow-supervisor", "pocketflow-multi-agent"]
          Workflow: ["pocketflow-workflow", "pocketflow-hello-world"]
          RAG: ["pocketflow-rag"]
          Batch: ["pocketflow-batch", "pocketflow-batch-node", "pocketflow-batch-flow"]
          Async: ["pocketflow-async-basic"]
          MapReduce: ["pocketflow-map-reduce"]
        outputs:
          - matched_examples  # 1-3个最相关的示例

  # 阶段3: 示例分析
  - id: example_analysis
    title: "分析参考示例"
    description: "深入分析参考示例的代码结构和设计模式"
    depends_on: [cookbook_scanning]
    tasks:
      - id: read_example_code
        description: "读取示例的 README.md 和 main.py"
        tools: ["Read"]
        actions:
          - read_readme
          - read_main_py
          - read_nodes_py  # 如果存在
          - read_utils  # 如果存在
        outputs:
          - example_code_structure

      - id: extract_patterns
        description: "提取设计模式"
        analysis_targets:
          - node_design_pattern  # 节点设计
          - flow_connection_pattern  # Flow 连接
          - shared_store_pattern  # 数据传递
          - utils_organization  # 工具函数组织
          - error_handling_pattern  # 错误处理
          - special_patterns  # Batch/Async 等特殊模式
        outputs:
          - design_patterns

  # 阶段4: 架构设计
  - id: architecture_design
    title: "设计应用架构"
    description: "基于需求和参考示例,设计新应用的架构"
    depends_on: [requirement_analysis, example_analysis]
    tasks:
      - id: design_directory_structure
        description: "设计目录结构"
        template: |
          {app_name}/
          ├── main.py              # 入口点
          ├── nodes.py             # 节点定义
          ├── flow.py              # 流程定义(可选)
          ├── utils/               # 工具函数
          │   ├── __init__.py
          │   └── call_llm.py
          ├── requirements.txt     # 依赖
          └── README.md            # 使用说明
        outputs:
          - directory_structure

      - id: design_shared_store
        description: "设计 Shared Store 结构"
        outputs:
          - shared_store_schema

      - id: design_nodes
        description: "设计节点列表"
        for_each_node:
          - name
          - type  # Node/BatchNode/AsyncNode
          - responsibility
          - prep_logic
          - exec_logic
          - post_logic
        outputs:
          - nodes_design

      - id: design_flow
        description: "设计流程图"
        format: "Mermaid"
        outputs:
          - flow_diagram

  # 阶段5: 项目配置推断
  - id: project_inference
    title: "推断项目配置"
    description: "分析当前环境,推断技术配置"
    depends_on: [architecture_design]
    tasks:
      - id: detect_environment
        description: "检测 Python 环境"
        tools: ["Bash"]
        checks:
          - python_version: "python --version"
          - virtual_env: "检查 venv/conda"
          - pocketflow_location: "pip show pocketflow"
          - llm_provider: "检查环境变量"
        outputs:
          - environment_info

      - id: generate_config
        description: "生成项目配置建议"
        outputs:
          - project_config

  # 阶段6: 代码生成
  - id: code_generation
    title: "生成应用代码"
    description: "生成完整的应用代码文件"
    depends_on: [architecture_design, project_inference]
    tasks:
      - id: generate_requirements
        description: "生成 requirements.txt"
        dependencies:
          - "pocketflow"
          - "根据需求添加其他依赖"
        tools: ["Write"]
        outputs:
          - requirements_txt

      - id: generate_utils
        description: "生成 utils/*.py"
        tools: ["Write"]
        files:
          - "utils/__init__.py"
          - "utils/call_llm.py"
          - "其他工具函数"
        code_style:
          - "包含完整 docstring"
          - "包含 if __name__ == '__main__' 测试"
          - "不捕获异常"
        outputs:
          - utils_files

      - id: generate_nodes
        description: "生成 nodes.py"
        tools: ["Write"]
        node_template: |
          class {NodeName}(Node):
              def prep(self, shared):
                  # 从 shared 读取数据
                  return data

              def exec(self, prep_res):
                  # 执行计算,不访问 shared
                  return result

              def post(self, shared, prep_res, exec_res):
                  # 写入 shared,返回 action
                  shared["key"] = exec_res
                  return "default"
        outputs:
          - nodes_py

      - id: generate_main
        description: "生成 main.py"
        tools: ["Write"]
        includes:
          - "import 语句"
          - "节点定义或引用"
          - "Flow 构建"
          - "示例运行代码"
        outputs:
          - main_py

      - id: generate_readme
        description: "生成 README.md"
        tools: ["Write"]
        sections:
          - "项目简介"
          - "安装步骤"
          - "快速开始"
          - "配置说明"
          - "示例用法"
          - "架构说明(Mermaid 图)"
        outputs:
          - readme_md

  # 阶段7: 质量检查
  - id: quality_check
    title: "质量检查"
    description: "检查生成的代码质量"
    depends_on: [code_generation]
    tasks:
      - id: validate_code
        description: "验证代码规范"
        checks:
          - "所有 import 可用"
          - "Node 遵循 prep-exec-post 模型"
          - "exec 中不访问 shared"
          - "BatchNode 的 post 正确处理 exec_res_list"
          - "AsyncNode 配合 AsyncFlow"
          - "工具函数包含测试代码"
          - "README 完整清晰"
        outputs:
          - quality_report

  # 阶段8: 项目初始化(可选)
  - id: project_initialization
    title: "项目初始化"
    description: "帮助用户初始化项目环境"
    depends_on: [code_generation, quality_check]
    optional: true
    tasks:
      - id: create_directory
        description: "创建项目目录"
        tools: ["Bash"]
        command: "mkdir -p {app_name}/utils"

      - id: install_dependencies
        description: "安装依赖"
        tools: ["Bash"]
        command: "pip install -r {app_name}/requirements.txt"
        optional: true

      - id: run_test
        description: "运行测试"
        tools: ["Bash"]
        command: "cd {app_name} && python main.py"
        optional: true

# ========================================
# 约束配置
# ========================================
constraints:
  # 强制约束
  prohibit:
    - "引用不存在的文件路径"
    - "违反 PocketFlow prep-exec-post 模型"
    - "在 exec 中访问 shared"
    - "过度工程化"

  # 必需要求
  require:
    - "扫描 cookbook/ 目录"
    - "生成完整项目结构(包括 README)"
    - "验证代码质量"
    - "包含详细注释和文档"

  # 允许操作
  allow:
    - "灵活的目录结构"
    - "选择 LLM 提供商"
    - "自定义工具函数"

# ========================================
# 质量标准
# ========================================
quality_standards:
  code:
    - "遵循 PocketFlow 架构规范"
    - "代码风格一致"
    - "完整的 docstring"
    - "包含测试代码"

  documentation:
    - "README 完整清晰"
    - "架构图使用 Mermaid"
    - "包含使用示例"

  functionality:
    - "生成的代码可直接运行"
    - "符合用户需求"
    - "继承 Cookbook 最佳实践"

# ========================================
# 输出规范
# ========================================
output_specification:
  directory_structure: |
    {app_name}/
    ├── main.py
    ├── nodes.py
    ├── utils/
    │   ├── __init__.py
    │   └── call_llm.py
    ├── requirements.txt
    └── README.md

  files_to_generate:
    - "main.py"
    - "nodes.py"
    - "utils/__init__.py"
    - "utils/call_llm.py"
    - "requirements.txt"
    - "README.md"
    - "flow.py (可选,复杂流程时)"

# ========================================
# 示例模板
# ========================================
templates:
  node_template: |
    class {NodeName}(Node):
        """
        {NodeDescription}
        """
        def prep(self, shared):
            """从 shared 读取数据并预处理"""
            return shared.get("{input_key}")

        def exec(self, prep_res):
            """执行核心逻辑,不访问 shared"""
            # TODO: 实现逻辑
            return result

        def post(self, shared, prep_res, exec_res):
            """将结果写回 shared 并决定下一步"""
            shared["{output_key}"] = exec_res
            return "default"

  main_template: |
    #!/usr/bin/env python3
    """
    {AppName} - {AppDescription}
    """
    from pocketflow import Node, Flow
    from nodes import *

    def main():
        # 初始化 shared store
        shared = {
            # TODO: 添加初始数据
        }

        # 构建 Flow
        flow = Flow(start=node1)
        # TODO: 添加节点连接

        # 运行
        flow.run(shared)

        # 输出结果
        print(shared.get("result"))

    if __name__ == "__main__":
        main()

# ========================================
# Cookbook 匹配规则
# ========================================
cookbook_matching:
  keywords_to_examples:
    agent: ["pocketflow-agent", "pocketflow-supervisor"]
    workflow: ["pocketflow-workflow"]
    rag: ["pocketflow-rag"]
    batch: ["pocketflow-batch", "pocketflow-batch-node"]
    async: ["pocketflow-async-basic"]
    search: ["pocketflow-agent", "pocketflow-tool-search"]
    multi_agent: ["pocketflow-multi-agent", "pocketflow-a2a"]
    map_reduce: ["pocketflow-map-reduce"]
    chat: ["pocketflow-chat", "pocketflow-chat-memory"]
    tool: ["pocketflow-tool-*"]

# ========================================
# 执行提示
# ========================================
execution_hints:
  - "严格按照 SKILL.md 中的九步执行"
  - "必须扫描 cookbook/ 目录作为参考"
  - "生成的代码必须可直接运行"
  - "包含完整的 README 和注释"
  - "遵循 PocketFlow 架构规范"
  - "不依赖不存在的外部文件"
