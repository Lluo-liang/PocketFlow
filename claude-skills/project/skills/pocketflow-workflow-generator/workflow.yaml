# 🔄 系统架构师主导的智能生成流程
stages:
  # 阶段-1：AI项目规范感知（新增优先阶段）
  - id: ai-project-standards-discovery
    title: "AI驱动的项目规范发现"
    workflow_owner: "system_architect"
    delegated_execution:
      primary_executor: "system_architect"
      execution_mode: "autonomous"
    depends_on: []
    priority: "highest"  # 最高优先级，必须最先执行

    tasks:
      # AI项目规范推断
      - constraint_task: "ai_project_standards_inference"
        rule: "利用AI能力自动推断项目核心规范"
        tool: "Task"  # 使用Task工具调用AI分析
        responsible_agent: "system_architect"
        ai_analysis_config:
          analysis_agent: "general-purpose"
          analysis_prompt: "${ai_driven_project_standards_engine.ai_standards_inference.semantic_analysis.analysis_prompt_template}"
          sample_collection: "${ai_driven_project_standards_engine.ai_standards_inference.intelligent_sampling}"
          project_scanning:
            scan_targets:
              - "../**/*.{java,js,py,ts,php}"
              - "../**/package.json"
              - "../**/pom.xml"
              - "../**/requirements.txt"
              - "../**/composer.json"
            analysis_depth: "standards_inference"
            exclude_patterns: ["node_modules", ".git", "target", "build", "vendor", "PocketFlow*"]
        success_criteria: ["项目规范推断完成", "规范置信度 > 0.7"]

      # 规范画像构建
      - constraint_task: "standards_profile_construction"
        rule: "构建项目规范画像和适配策略"
        tool: "Write"
        responsible_agent: "system_architect"
        profile_construction: "${ai_driven_project_standards_engine.standards_profile_construction}"
        outputs:
          project_standards_profile: "${ANALYSIS_CACHE}/project-standards-profile.json"
          team_onboarding_guide: "${ANALYSIS_CACHE}/project-standards-guide.md"
        success_criteria: ["规范画像构建完成", "适配策略制定完成"]

      # 工作流生成器配置调整
      - constraint_task: "workflow_generator_configuration_adaptation"
        rule: "基于项目规范调整工作流生成配置"
        tool: "Edit"
        responsible_agent: "system_architect"
        adaptation_targets:
          constraint_rules: "调整约束规则匹配项目标准"
          template_selection: "配置模板选择偏好"
          domain_classification: "增强领域分类准确性"
          code_generation_rules: "设置代码生成规范"
        adaptation_strategy: "${ai_driven_project_standards_engine.standards_application_strategy}"
        success_criteria: ["配置调整完成", "规范适配生效"]

    outputs: [
      "${ANALYSIS_CACHE}/project-standards-profile.json",
      "${ANALYSIS_CACHE}/project-standards-guide.md",
      "${ANALYSIS_CACHE}/workflow-generator-adaptation.json"
    ]

  # 阶段0：资源发现和验证（新增关键阶段）
  - id: resource-discovery-and-validation
    title: "资源发现和验证"
    workflow_owner: "system_architect"
    delegated_execution:
      primary_executor: "system_architect"
      execution_mode: "autonomous"
    depends_on: ["ai-project-standards-discovery"]
    priority: "critical"  # 最高优先级，必须先执行

    tasks:
      # 扫描可用模板资源
      - constraint_task: "scan_available_templates"
        rule: "扫描并验证所有可用的模板文件"
        tool: "LS"  # 使用LS工具列出目录内容
        responsible_agent: "system_architect"
        # 🔒 强制验证约束 - 防止AI随意发挥
        mandatory_constraints:
          - constraint_type: "RESOURCE_VALIDATION"
            rule: "必须实际扫描目录，不得假设模板存在"
            enforcement: "BLOCKING"
            validation_method: "ACTUAL_DIRECTORY_SCAN"
            failure_action: "ABORT_WITH_DIRECTORY_SCAN_REPORT"

          - constraint_type: "TEMPLATE_EXISTENCE_CHECK"
            rule: "必须验证每个发现的模板文件可读性"
            enforcement: "MANDATORY"
            validation_method: "FILE_READABILITY_TEST"
            failure_action: "EXCLUDE_UNREADABLE_TEMPLATES"

          - constraint_type: "NO_FICTIONAL_TEMPLATES"
            rule: "禁止在扫描结果中添加虚构的模板"
            enforcement: "STRICT_BLOCKING"
            detection_method: "CROSS_REFERENCE_ACTUAL_FILES"
            violation_action: "ABORT_GENERATION"
        scan_config:
          # 使用通配符动态扫描所有插件的模板目录
          directories_to_scan: [
            "../../_shared/plugins/*/templates/"
          ]
          scan_pattern: "**/*.{mdc,yaml,yml,md}"
        outputs:
          available_templates_catalog: "${ANALYSIS_CACHE}/available-templates.json"
          template_capabilities_mapping: "${ANALYSIS_CACHE}/template-capabilities.json"
        success_criteria: ["可用模板扫描完成", "模板能力映射建立"]

      # 验证插件能力
      - constraint_task: "validate_plugin_capabilities"
        rule: "读取并验证所有插件的实际能力"
        tool: "Read"  # 使用Read工具读取插件定义
        responsible_agent: "system_architect"
        # 使用通配符动态验证所有插件
        validation_targets_pattern: "../../_shared/plugins/*/plugin.yaml"
        validation_mode: "auto_discover_and_validate"
        outputs:
          validated_plugin_capabilities: "${ANALYSIS_CACHE}/validated-plugin-capabilities.json"
          plugin_dependency_matrix: "${ANALYSIS_CACHE}/plugin-dependencies.json"
        success_criteria: ["插件能力验证完成", "依赖关系明确"]

      # 动态MCP工具发现和验证
      - constraint_task: "discover_and_verify_mcp_tools"
        rule: "动态扫描integrations目录，发现并验证可用的MCP工具能力"
        tool: "Read"  # 使用Read工具读取integrations文档
        responsible_agent: "system_architect"
        discovery_strategy:
          integrations_directory: "../../_shared/core/integrations/"
          parse_task_master_capabilities: true
          parse_xmind_capabilities: true
          parse_workflow_parser_capabilities: true
          builtin_tools_priority: true
          fallback_mapping_required: true
        tool_discovery_process:
          step1_scan_directory: "扫描../../_shared/core/integrations/目录"
          step2_parse_documents: "解析.md文档中的工具定义"
          step3_extract_capabilities: "提取智能体权限和工具映射"
          step4_build_tool_matrix: "构建工具可用性矩阵"
          step5_create_fallback_mapping: "创建内置工具回退映射"
        outputs:
          discovered_mcp_capabilities: "${ANALYSIS_CACHE}/discovered-mcp-capabilities.json"
          tool_agent_matrix: "${ANALYSIS_CACHE}/tool-agent-matrix.json"
          tool_fallback_mapping: "${ANALYSIS_CACHE}/tool-fallback-mapping.json"
        success_criteria: ["MCP工具发现完成", "工具能力矩阵建立", "回退策略建立"]

    outputs: [
      "${ANALYSIS_CACHE}/resource-validation-report.json",
      "${ANALYSIS_CACHE}/available-resources-catalog.json"
    ]

  # 阶段1：系统架构师委派：全面需求和上下文分析
  - id: comprehensive-requirement-and-context-analysis
    title: "全面需求和上下文分析"
    workflow_owner: "system_architect"  # 系统架构师作为委派者
    delegated_execution:
      primary_executor: "system_architect"  # 主要执行者也是架构师
      supporting_roles: ["business_analyst", "tech_lead"]  # 支持角色
      execution_mode: "autonomous"  # 自主执行，无需用户介入
    depends_on: ["ai-project-standards-discovery", "resource-discovery-and-validation"]  # 依赖项目规范感知和资源验证
    priority: "highest"

    tasks:
      # 系统架构师主导：规范感知的语义理解分析
      - constraint_task: "architect_led_semantic_intent_analysis"
        rule: "系统架构师主导用户需求的深度理解和技术意图解析，结合项目规范"
        tool: "Read"  # 使用内置工具进行语义分析
        responsible_agent: "system_architect"
        analysis_approach: "architecture_centric_requirement_understanding"
        analysis_prompt: "${semantic_understanding_engine.analysis_prompts.intent_extraction}"
        # 新增：项目规范感知增强
        project_standards_integration:
          standards_profile_input: "${ANALYSIS_CACHE}/project-standards-profile.json"
          standards_aware_analysis: true
          adaptation_considerations:
            - "结合项目命名规范理解需求"
            - "基于项目质量标准调整期望"
            - "考虑项目技术偏好进行解读"
            - "匹配项目团队协作习惯"
        architect_focus:
          - "工作流架构模式需求识别"
          - "技术栈和集成要求分析"
          - "质量和性能需求评估"
          - "可维护性和扩展性要求"
          - "项目规范一致性要求"  # 新增
        success_criteria:
          - "意图置信度 > 0.7"
          - "架构需求明确"
          - "技术约束清晰"
          - "质量标准确定"
          - "项目规范适配完成"  # 新增
        failure_action: "REQUEST_TECHNICAL_CLARIFICATION"

      # 系统架构师委派：代码库上下文分析
      - constraint_task: "architect_delegated_codebase_analysis"
        rule: "架构师委派技术负责人进行代码库技术架构分析"
        tool: "Glob"  # 使用内置工具扫描项目结构
        responsible_agent: "tech_lead"  # 委派给技术负责人
        delegated_by: "system_architect"
        scanning_strategy: "${codebase_analysis_engine.scanning_strategies}"
        analysis_depth: "architecture_focused"
        delegation_requirements:
          - "识别现有工作流架构模式"
          - "评估技术栈兼容性"
          - "分析集成复杂度"
          - "评估扩展性和维护性"
        success_criteria:
          - "技术栈识别完成"
          - "架构模式确定"
          - "技术约束明确"
          - "集成点识别完成"
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 系统架构师委派：行业最佳实践匹配
      - constraint_task: "architect_delegated_industry_practice_matching"
        rule: "架构师委派业务分析师进行行业最佳实践匹配和合规要求分析"
        tool: "Read"  # 使用内置工具读取知识库信息
        responsible_agent: "business_analyst"  # 委派给业务分析师
        delegated_by: "system_architect"
        matching_algorithm: "${industry_knowledge_engine.industry_classification}"
        delegation_requirements:
          - "识别行业特定的工作流模式"
          - "确定合规和安全要求"
          - "评估业务流程复杂度"
          - "匹配最佳实践模板"
        success_criteria:
          - "行业类型识别准确"
          - "最佳实践建议完整"
          - "合规要求明确"
          - "业务模式匹配"
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 系统架构师主导：能力评估和架构决策
      - constraint_task: "architect_led_capability_assessment_and_decision"
        rule: "架构师主导PocketFlow能力评估并做出架构扩展决策"
        tool: "Grep"  # 使用内置工具进行能力匹配分析
        responsible_agent: "system_architect"
        assessment_criteria: "${capability_assessment_engine.requirement_capability_matching}"
        architectural_decision_making:
          - "评估现有插件域覆盖度"
          - "决定是否需要新增插件域"
          - "确定约束框架扩展需求"
          - "评估角色能力匹配度"
        success_criteria:
          - "能力匹配度评估完成"
          - "架构扩展决策明确"
          - "技术路径确定"
          - "资源需求评估完成"
        failure_action: "REQUEST_EXPERT_CONSULTATION"

    outputs: [
      "${ANALYSIS_CACHE}/semantic-analysis.json",
      "${ANALYSIS_CACHE}/codebase-analysis.json",
      "${ANALYSIS_CACHE}/industry-analysis.json",
      "${ANALYSIS_CACHE}/capability-assessment.json"
    ]

  # 阶段2：系统架构师主导：智能能力扩展和架构设计
  - id: architect-led-capability-extension-and-design
    title: "架构师主导的能力扩展和架构设计"
    workflow_owner: "system_architect"  # 系统架构师主导
    delegated_execution:
      primary_executor: "system_architect"  # 主要执行者
      supporting_roles: ["tech_lead", "senior_engineer", "quality_expert"]  # 支持角色
      execution_mode: "conditional_autonomous"  # 条件自主执行
    depends_on: ["comprehensive-requirement-and-context-analysis"]
    condition: "capability_gaps_identified == true OR architecture_extension_required == true"

    tasks:
      # 系统架构师主导：架构扩展决策
      - constraint_task: "architect_led_architecture_extension_decision"
        rule: "架构师基于需求分析做出PocketFlow架构扩展决策"
        tool: "Read"  # 使用内置工具进行研究分析
        responsible_agent: "system_architect"
        decision_framework:
          extension_evaluation_criteria:
            - "现有插件域覆盖度评估"
            - "新需求与现有架构的匹配度"
            - "扩展成本与收益分析"
            - "架构一致性和维护性考虑"
          extension_decision_matrix:
            plugin_domain_extension: "需要新增插件域时的决策逻辑"
            constraint_framework_extension: "需要扩展约束框架时的决策逻辑"
            agent_role_extension: "需要新增代理角色时的决策逻辑"
            integration_extension: "需要新增集成能力时的决策逻辑"
        success_criteria: ["架构扩展决策完成", "扩展方案明确", "实施计划确定"]
        failure_action: "USE_EXISTING_ARCHITECTURE"

      # 系统架构师委派：自定义插件生成
      - constraint_task: "architect_delegated_custom_plugin_generation"
        rule: "架构师委派高级工程师基于缺口分析生成所需的领域插件"
        tool: "Write"  # 使用内置工具生成文件
        responsible_agent: "senior_engineer"  # 委派给高级工程师
        delegated_by: "system_architect"
        condition: "missing_plugins.count > 0"
        generation_template: "${capability_assessment_engine.automatic_capability_extension}"
        delegation_requirements:
          - "遵循PocketFlow3.0插件域架构规范"
          - "确保插件与现有架构的兼容性"
          - "实现模块化和可维护性设计"
          - "提供完整的插件文档和测试"
        success_criteria: ["自定义插件生成完成", "架构合规性验证通过"]
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 系统架构师委派：专门代理角色创建
      - constraint_task: "architect_delegated_specialized_agent_creation"
        rule: "架构师委派技术负责人创建满足特定需求的专门代理角色"
        tool: "Write"  # 使用内置工具生成文件
        responsible_agent: "tech_lead"  # 委派给技术负责人
        delegated_by: "system_architect"
        condition: "insufficient_agents.count > 0"
        delegation_requirements:
          - "基于现有角色体系设计新角色"
          - "确保角色权限和职责清晰"
          - "维护角色协作关系的一致性"
          - "提供角色能力和交互规范"
        success_criteria: ["专门代理创建完成", "角色体系一致性保持"]
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 系统架构师委派：工具集成桥梁构建
      - constraint_task: "architect_delegated_integration_bridge_creation"
        rule: "架构师委派技术负责人构建工具链集成桥梁"
        tool: "Write"  # 使用内置工具生成文件
        responsible_agent: "tech_lead"  # 委派给技术负责人
        delegated_by: "system_architect"
        condition: "integration_gaps.count > 0"
        delegation_requirements:
          - "设计符合PocketFlow集成规范的桥梁"
          - "确保集成的稳定性和可靠性"
          - "提供完整的集成测试和文档"
          - "考虑未来扩展和维护需求"
        success_criteria: ["集成桥梁构建完成", "集成测试通过"]
        failure_action: "ESCALATE_TO_ARCHITECT"

    outputs: [
      "${PLM_DIR}/generated/custom-plugins/",
      "${PLM_DIR}/generated/specialized-agents/",
      "${PLM_DIR}/generated/integration-bridges/"
    ]

  # 阶段3：系统架构师主导：工作流架构设计和用户确认
  - id: architect-led-workflow-architecture-design
    title: "架构师主导的工作流架构设计"
    workflow_owner: "system_architect"  # 系统架构师主导
    delegated_execution:
      primary_executor: "system_architect"  # 主要执行者
      supporting_roles: ["business_analyst", "tech_lead", "quality_expert"]  # 支持角色
      execution_mode: "semi_autonomous"  # 需要用户确认架构决策
      intervention_point: "architecture_decision_validation"  # 用户介入点：架构决策验证
    depends_on: ["comprehensive-requirement-and-context-analysis", "architect-led-capability-extension-and-design"]
    condition: "architecture_design_required == true"

    # 渐进式细化配置
    refinement_config:
      iteration_strategy: "${progressive_refinement_engine.refinement_strategy}"
      max_iterations: "${progressive_refinement_engine.iteration_control.max_iterations}"
      convergence_threshold: "${progressive_refinement_engine.iteration_control.convergence_criteria}"

    tasks:
      # 初始化交互式上下文
      - constraint_task: "initialize_interactive_context"
        rule: "初始化交互式分析上下文和状态管理"
        tool: "Write"  # 使用内置工具管理状态
        initialization_data:
          - semantic_analysis_results: "${ANALYSIS_CACHE}/semantic-analysis.json"
          - codebase_context: "${ANALYSIS_CACHE}/codebase-analysis.json"
          - capability_gaps: "${ANALYSIS_CACHE}/capability-assessment.json"
        success_criteria: ["上下文初始化完成", "状态管理启动"]
        failure_action: "USE_NON_INTERACTIVE_MODE"

      # 工作流需求理解和类型识别
      - constraint_task: "workflow_requirement_understanding"
        rule: "理解用户的工作流需求并识别工作流类型"
        tool: "Read"  # 使用内置工具进行需求分析

        understanding_focus:
          workflow_type_identification: "识别需要生成的工作流类型"
          complexity_assessment: "评估工作流复杂度"
          domain_requirements: "确定领域特定需求"
          architecture_requirements: "评估架构组织需求"

        success_criteria:
          - "工作流类型明确"
          - "复杂度评估完成"
          - "架构需求识别"
        failure_action: "USE_GENERAL_WORKFLOW_TEMPLATE"

      # 最终需求确认和验证
      - constraint_task: "final_requirement_confirmation"
        rule: "基于渐进式细化结果确认最终需求"
        tool: "Read"  # 使用内置工具进行需求分析
        confirmation_criteria:
          completeness_threshold: 0.9
          consistency_threshold: 0.85
          user_confidence_threshold: 0.8
        success_criteria:
          - "需求确认完成"
          - "一致性验证通过"
          - "完整性检查通过"
        failure_action: "REQUEST_ADDITIONAL_CLARIFICATION"

    outputs: [
      "${ANALYSIS_CACHE}/refined-requirements.json",
      "${ANALYSIS_CACHE}/user-interaction-history.json",
      "${ANALYSIS_CACHE}/risk-analysis-comprehensive.json",
      "${ANALYSIS_CACHE}/context-evolution-trace.json"
    ]

  # 阶段4：系统架构师主导：智能工作流合成和cookbook质量注入
  - id: architect-led-intelligent-workflow-synthesis
    title: "架构师主导的智能工作流合成"
    workflow_owner: "system_architect"  # 系统架构师主导
    delegated_execution:
      primary_executor: "system_architect"  # 主要执行者
      supporting_roles: ["tech_lead", "senior_engineer", "quality_expert", "business_analyst"]  # 支持角色
      execution_mode: "autonomous"  # 自主执行工作流合成
    depends_on: ["comprehensive-requirement-and-context-analysis", "architect-led-capability-extension-and-design", "architect-led-workflow-architecture-design"]

    tasks:
      # 系统架构师主导：综合分析结果整合和架构决策
      - constraint_task: "architect_led_comprehensive_analysis_integration"
        rule: "架构师整合所有分析结果并做出最终的工作流架构决策"
        tool: "Read"  # 使用内置工具进行研究分析
        responsible_agent: "system_architect"
        integration_approach: "architecture_centric_synthesis"
        integration_sources: [
          "semantic_analysis", "codebase_analysis",
          "industry_analysis", "capability_assessment",
          "architecture_extension_decisions", "user_architecture_confirmations",
          "project_standards_profile"  # 新增：项目规范画像
        ]
        architectural_synthesis:
          - "确定工作流的整体架构模式"
          - "选择合适的主导角色和委派策略"
          - "设计阶段划分和依赖关系"
          - "确定质量门禁和约束机制"
          - "应用项目规范约束和适配策略"  # 新增
        success_criteria: ["综合需求理解完成", "架构决策明确", "合成策略确定"]
        failure_action: "REQUEST_ARCHITECTURE_CLARIFICATION"

      # 系统架构师委派：智能角色选择和架构模式应用
      - constraint_task: "architect_delegated_intelligent_role_selection"
        rule: "架构师委派业务分析师进行角色选择，但架构师确定主导角色和委派模式"
        tool: "Read"  # 使用内置工具进行研究分析
        responsible_agent: "business_analyst"  # 委派给业务分析师
        delegated_by: "system_architect"
        role_selection_approach: "architecture_pattern_first"
        role_selection_config:
          selection_engine: "${intelligent_role_selection_engine}"
          architectural_constraints:
            - primary_role_determination: "由架构师确定主导角色"
            - delegation_model_design: "设计符合cookbook模式的委派关系"
            - authority_hierarchy_establishment: "建立清晰的权威层次"
            - execution_mode_selection: "选择合适的执行模式"
          analysis_inputs:
            - workflow_type: "从语义分析中提取工作流类型"
            - technical_requirements: "从代码库分析中提取技术需求"
            - industry_context: "从行业分析中提取领域信息"
            - complexity_level: "从能力评估中提取复杂度级别"
            - architecture_decisions: "从架构决策中获取约束条件"

        selection_process:
          # 步骤1：角色发现和扫描
          - step: "discover_available_roles"
            action: "扫描../../_shared/agents/roles/目录获取所有可用角色"
            output: "available_roles_inventory"

          # 步骤2：工作流类型匹配
          - step: "workflow_type_matching"
            action: "基于工作流类型匹配推荐角色组合"
            matching_rules: "${intelligent_role_selection_engine.role_matching_strategy.workflow_type_mapping}"
            output: "type_based_role_recommendations"

          # 步骤3：关键词语义匹配
          - step: "keyword_semantic_matching"
            action: "基于需求关键词进行语义匹配"
            matching_rules: "${intelligent_role_selection_engine.role_matching_strategy.keyword_matching_rules}"
            output: "keyword_based_role_scores"

          # 步骤4：协作关系优化
          - step: "collaboration_optimization"
            action: "基于角色协作关系优化角色组合"
            optimization_rules: "${intelligent_role_selection_engine.role_matching_strategy.collaboration_optimization}"
            output: "optimized_role_combinations"

          # 步骤5：多准则评分和选择
          - step: "multi_criteria_scoring"
            action: "对候选角色进行多准则评分和最终选择"
            scoring_algorithm: "${intelligent_role_selection_engine.role_selection_algorithm}"
            output: "final_selected_roles"

        success_criteria:
          - "角色选择完成"
          - "选择置信度 > 0.8"
          - "角色组合协作性验证通过"
          - "权限覆盖完整性检查通过"
        failure_action: "USE_DEFAULT_ROLE_COMBINATION"

      # 基于cookbook经验的智能工作流设计
      - constraint_task: "cookbook_informed_workflow_design"
        rule: "基于cookbook最佳实践设计高质量的模块化工作流"
        tool: "Write"  # 使用内置工具生成文件
        depends_on: ["intelligent_role_selection"]
        design_principles:
          - architecture_pattern_application: "应用cookbook验证的架构模式"
          - modular_component_separation: "实现模块化组件分离"
          - role_driven_design: "基于角色能力设计任务分配"
          - pocketflow_compliance: "严格遵循PocketFlow 3.0架构规范"

        # 角色驱动的工作流设计
        role_driven_design:
          selected_roles_input: "${final_selected_roles}"
          role_assignment_strategy: "capability_based_task_allocation"
          role_collaboration_design:
            - generate_role_interaction_matrix: "生成角色交互矩阵"
            - define_handoff_points: "定义角色间的交接点"
            - establish_approval_chains: "建立审批链"
            - configure_escalation_paths: "配置升级路径"

        # 基于cookbook经验的架构化工作流生成
        cookbook_driven_workflow_generation:
          # 应用cookbook验证的架构模式
          architecture_pattern_application:
            modular_separation: "${workflow_architecture_patterns.modular_component_separation}"
            role_driven_design: "${workflow_architecture_patterns.role_driven_workflow_design}"
            directory_compliance: "${workflow_architecture_patterns.pocketflow_directory_compliance}"

          # 智能组件提取策略（基于cookbook经验）
          intelligent_component_extraction:
            engine_extraction_criteria:
              - "复杂业务逻辑 > 50行"
              - "可复用配置块"
              - "特定领域知识"

            template_extraction_criteria:
              - "输出文档生成需求"
              - "报告格式定义"
              - "标准化输出要求"

            constraint_extraction_criteria:
              - "业务规则约束"
              - "质量门禁要求"
              - "合规性检查"

          stages_design:
            method: "role_responsibility_mapping + architecture_compliance"
            principles:
              - "每个阶段明确负责角色"
              - "阶段间依赖关系清晰"
              - "质量门控节点合理设置"
              - "并行任务优化安排"
              - "组件拆分符合架构规范"  # 新增
              - "模板驱动的输出生成"  # 新增

          tasks_allocation:
            method: "role_capability_matching + component_separation"
            allocation_rules:
              - "核心任务分配给primary_role"
              - "协作任务分配给collaborative_roles"
              - "审查任务分配给authority_roles"
              - "质量门控任务分配给quality_roles"
              - "模板生成任务分配给doc_domain"  # 新增
              - "约束验证任务分配给constraint_framework"  # 新增

        # 增强：模板驱动的组件生成和架构拆分
        template_driven_component_generation:
          # 架构拆分执行
          architecture_decomposition_execution:
            engine: "${pocketflow_architecture_engine}"
            decomposition_strategy: "${pocketflow_architecture_engine.workflow_decomposition_strategy}"
            file_organization: "${pocketflow_architecture_engine.file_organization_strategy}"

          # 模板驱动报告生成集成
          template_engine_integration:
            template_engine: "${template_driven_report_engine}"
            template_selection: "${template_driven_report_engine.template_management_strategy.template_selection_logic}"
            report_pipeline: "${template_driven_report_engine.report_generation_pipeline}"

          # 基于验证资源的组件生成规则
          component_generation_rules:
            # 主工作流文件生成
            main_workflow_generation:
              target_location: "workflows/user-workflows/"
              resource_validation_required: true
              tool_mapping_strategy: "use_verified_tools_only"
              template_reference_strategy: "use_existing_templates_only"

            # 基于实际扫描结果的模板选择
            template_selection_logic:
              resource_discovery_input: "${ANALYSIS_CACHE}/available-templates.json"
              selection_strategy: "match_existing_templates"
              template_mapping:
                test_generation_workflow:
                  - "../../_shared/plugins/doc-domain/templates/common-test-example-gen.mdc"
                  - "../../_shared/plugins/doc-domain/templates/half-desc-test-example-gen.mdc"
                requirement_analysis_workflow:
                  - "../../_shared/plugins/doc-domain/templates/prd-requirement-analysis-report-template.mdc"
                technical_design_workflow:
                  - "../../_shared/plugins/doc-domain/templates/prd-analyze-requirement-design.mdc"
              fallback_strategy: "use_available_or_skip"

            # 角色定义生成
            agent_roles_generation:
              condition: "workflow_requires_specialized_agents == true"
              target_location: "../../_shared/agents/roles/"
              generation_rule: "基于工作流需求生成或增强现有角色定义"
              template_base: "agent-role-template.yaml"

            # 质量门禁生成
            quality_gates_generation:
              condition: "workflow_has_quality_requirements == true"
              target_location: "quality-gates/"
              generation_rule: "为工作流质量要求生成对应的质量门禁"
              template_base: "quality-gate-template.yaml"

          template_mapping:
            business_oriented: "${business_oriented_template}"
            task_master_hosted: "${task_master_config.generated_workflow_defaults}"
            non_hosted: "${non_hosted_template}"
          execution_mode: "architecture_aware_intelligent_selection"
          converter_integration: "conditional"
          selected_roles_injection: true
          business_focus_enhancement: "conditional"
          abstraction_control: "${abstraction_control_engine}"

        # 资源验证集成的工作流生成策略
        resource_validated_workflow_generation:
          input_resources:
            available_templates: "${ANALYSIS_CACHE}/available-templates.json"
            verified_tools: "${ANALYSIS_CACHE}/tool-availability.json"
            plugin_capabilities: "${ANALYSIS_CACHE}/validated-plugin-capabilities.json"

          generation_constraints:
            only_use_verified_tools: true
            only_reference_existing_templates: true
            validate_plugin_dependencies: true
            require_fallback_strategies: true

          tool_mapping_enforcement:
            code_analysis_tools: ["Read", "Grep", "Glob"]
            file_operations: ["Write", "Edit", "MultiEdit"]
            project_scanning: ["LS", "Bash"]
            data_processing: ["Bash"]
            forbidden_assumptions: ["mcp/*"]  # 禁止假设MCP工具存在

          # 强制验证规则
          mandatory_validation_rules:
            template_existence_check:
              rule: "生成工作流前必须验证所有引用的模板文件实际存在"
              validation_method: "scan_template_directories"
              failure_action: "use_available_or_remove_reference"

            tool_availability_check:
              rule: "验证MCP工具可用性，优先使用Task-Master和XMind分析工具"
              validation_method: "check_pocketflow_mcp_capabilities"
              available_tool_sets: ["task_master_tools", "xmind_analysis_tools"]
              failure_action: "use_available_mcp_or_builtin_fallback"

              # 工具可用性验证矩阵
              validation_matrix:
                task_master_available: true  # PocketFlow 3.0核心MCP工具
                xmind_analysis_available: true  # 企业级思维导图分析
                external_mcp_available: false  # 外部未验证的MCP工具
                builtin_tools_available: true  # 内置工具始终可用

            plugin_capability_validation:
              rule: "确保引用的插件引擎和组件实际存在且可用"
              validation_method: "validate_plugin_component_paths"
              failure_action: "create_placeholder_or_remove"

          # 资源替换策略
          resource_replacement_strategies:
            missing_template_handling:
              strategy: "智能模板替换或创建"
              replacement_logic:
                test_case_generation:
                  primary_template: "../../_shared/plugins/doc-domain/templates/common-test-example-gen.mdc"
                  fallback_template: "../../_shared/plugins/doc-domain/templates/half-desc-test-example-gen.mdc"
                  create_if_missing: false
                requirement_analysis:
                  primary_template: "../../_shared/plugins/doc-domain/templates/prd-requirement-analysis-report-template.mdc"
                  fallback_template: "../../_shared/plugins/doc-domain/templates/prd-analyze-requirement-design.mdc"
                  create_if_missing: false

            unavailable_tool_handling:
              strategy: "优先使用PocketFlow MCP工具，后备内置工具"
              replacement_mapping:
                # 优先级：使用PocketFlow实际MCP工具
                test_analysis_needs:
                  primary: ["task_master.coverage_analysis", "task_master.test_strategy_planning"]
                  fallback: ["Read", "Grep", "Bash"]
                semantic_analysis_needs:
                  primary: ["task_master.research", "xmind_analysis.requirements_extraction"]
                  fallback: ["Read", "Grep"]
                codebase_analysis_needs:
                  primary: ["task_master.analyze_project_complexity", "task_master.research"]
                  fallback: ["Read", "Glob", "Grep"]
                test_generation_needs:
                  primary: ["task_master.generate", "task_master.expand_task"]
                  fallback: ["Write", "MultiEdit"]
                project_management_needs:
                  primary: ["task_master.add_task", "task_master.validate_dependencies", "task_master.project_coordination"]
                  fallback: ["Read", "Write", "Bash"]
                requirement_analysis_needs:
                  primary: ["task_master.parse_prd", "xmind_analysis.requirements_extraction", "task_master.requirement_validation"]
                  fallback: ["Read", "Grep"]
                architecture_design_needs:
                  primary: ["task_master.architecture_design", "task_master.technology_selection", "xmind_analysis.architecture_requirements"]
                  fallback: ["Read", "Write"]
                security_analysis_needs:
                  primary: ["task_master.security_audit", "task_master.vulnerability_assessment", "task_master.threat_modeling"]
                  fallback: ["Read", "Grep"]
                performance_analysis_needs:
                  primary: ["task_master.performance_audit", "task_master.bottleneck_analysis"]
                  fallback: ["Read", "Bash"]
                quality_validation_needs:
                  primary: ["task_master.quality_gate_validation", "task_master.validate_dependencies"]
                  fallback: ["Read", "Write"]

            missing_engine_handling:
              strategy: "简化逻辑或移除引用"
              simplification_rules:
                - "将复杂引擎引用简化为基础任务配置"
                - "移除不存在的外部组件引用"
                - "使用内联配置替换外部引擎引用"

        # 业务导向工作流质量保证
        business_workflow_quality_assurance:
          enabled: true
          validation_criteria:
            business_language_compliance:
              check: "验证问题生成配置使用业务语言"
              threshold: 0.9
              validation_points:
                - "问题生成原则包含avoid_technical_jargon"
                - "问题类型设置avoid_technical_details标记"
                - "上下文配置优先使用business_context"
                - "抽象层次设置为business相关级别"

            stakeholder_focus_validation:
              check: "验证工作流关注干系人和业务价值"
              threshold: 0.85
              validation_points:
                - "包含stakeholder_impact_analysis问题类型"
                - "包含business_value_clarification问题类型"
                - "配置了target_audience定义"
                - "包含ROI和业务价值分析任务"

            technical_jargon_detection:
              check: "检测并标记技术术语使用"
              threshold: 0.95
              detection_engine: "${abstraction_control_engine.technical_jargon_filter}"
              auto_replacement: true

            abstraction_level_consistency:
              check: "验证抽象层次一致性"
              threshold: 0.9
              validation_points:
                - "所有问题类型具有适当的abstraction_level"
                - "抽象层次与目标用户群体匹配"
                - "避免技术实现细节"

        success_criteria:
          - "工作流设计完成"
          - "角色分配合理"
          - "协作关系清晰"
          - "质量检查通过"
          - "依赖关系正确"
          - "Task-Master配置注入完成"
          - "业务导向质量验证通过"  # 新增
        failure_action: "USE_TEMPLATE_BASED_DESIGN"

      # 工作流托管需求判断 (新增)
      - constraint_task: "workflow_hosting_decision"
        rule: "智能判断生成的工作流是否需要Task-Master托管"
        tool: "Read"  # 使用内置工具进行分析
        decision_engine: "${workflow_hosting_decision_engine}"
        analysis_inputs:
          - workflow_complexity: "分析工作流执行复杂度"
          - state_management: "评估状态持久化需求"
          - constraint_requirements: "分析约束验证需求"
          - tool_coordination: "评估工具协调复杂度"
          - file_operations: "分析文件系统操作需求"
        decision_criteria:
          scoring_method: "${workflow_hosting_decision_engine.decision_algorithm.scoring_method}"
          weights: "${workflow_hosting_decision_engine.decision_algorithm.criteria_weights}"
          thresholds: "${workflow_hosting_decision_engine.decision_algorithm}"
        success_criteria:
          - "托管需求判断完成"
          - "判断置信度 > 0.8"
        failure_action: "DEFAULT_TO_HOSTING"

      # 条件化Task-Master配置注入 (修改)
      - constraint_task: "conditional_task_master_config_injection"
        rule: "根据判断结果条件化注入Task-Master配置"
        tool: "Edit"  # 使用内置工具编辑配置
        condition: "hosting_decision_score >= 0.6"
        config_injection:
          target_section: "task_master_config"
          template_source: "${generated_workflow_templates.task_master_hosted_template}"
          required_fields:
            - execution_mode: "task-master-driven"
            - converter_required: true
            - conversion_command: "python plugins/workflow-domain/converter.py -i {workflow_file} -o {output_file} --agents-mode --validate --pretty"
        success_criteria:
          - "Task-Master配置注入完成"
          - "转换命令配置正确"
        failure_action: "USE_NON_HOSTED_CONFIG"

      # 非托管配置注入 (新增)
      - constraint_task: "non_hosted_config_injection"
        rule: "为不需要托管的工作流注入非托管配置"
        tool: "Edit"  # 使用内置工具编辑配置
        condition: "hosting_decision_score <= 0.4"
        config_injection:
          target_section: "execution_config"
          template_source: "${generated_workflow_templates.non_hosted_template}"
          required_fields:
            - execution_mode: "ai-tool-native"
            - direct_execution: true
            - no_conversion_needed: true
        success_criteria:
          - "非托管配置注入完成"
          - "执行模式配置正确"
        failure_action: "USE_DEFAULT_CONFIG"

      # 自适应优化
      - constraint_task: "adaptive_optimization"
        rule: "基于学习到的偏好和约束进行工作流优化"
        tool: "MultiEdit"  # 使用内置工具进行多处优化修改
        optimization_targets:
          - efficiency: "提高执行效率"
          - quality: "保证输出质量"
          - usability: "提升用户体验"
          - task_master_compatibility: "确保Task-Master兼容性"
        success_criteria: ["工作流优化完成"]
        failure_action: "USE_BASIC_WORKFLOW"

    outputs: [
      "${PLM_DIR}/generated/intelligent-workflow.yaml",
      "${PLM_DIR}/generated/workflow-analysis-report.md",
      "${ANALYSIS_CACHE}/selected-roles-analysis.json",
      "${ANALYSIS_CACHE}/role-collaboration-matrix.json"
    ]

  # 阶段5：系统架构师主导：工作流部署和质量验证
  - id: architect-led-deployment-and-quality-validation
    title: "架构师主导的工作流部署和质量验证"
    workflow_owner: "system_architect"  # 系统架构师主导
    delegated_execution:
      primary_executor: "system_architect"  # 主要执行者
      supporting_roles: ["tech_lead", "quality_expert"]  # 支持角色
      execution_mode: "autonomous"  # 自主执行部署
      final_review_required: true  # 需要最终审核
    depends_on: ["architect-led-intelligent-workflow-synthesis"]

    tasks:
      # 系统架构师主导：cookbook质量验证
      - constraint_task: "architect_led_cookbook_quality_validation"
        rule: "架构师主导对生成的工作流进行cookbook级别质量验证"
        tool: "Read"  # 使用内置工具验证文件内容
        responsible_agent: "system_architect"
        quality_validation_framework: "${cookbook_quality_injection_engine.cookbook_quality_assurance}"
        validation_dimensions:
          - cookbook_fidelity_validation: "验证与cookbook模式的一致性"
          - architectural_rigor_validation: "验证架构严谨性和合规性"
          - execution_sophistication_validation: "验证执行机制的复杂性"
          - business_integration_validation: "验证业务集成能力"
          - technical_excellence_validation: "验证技术卓越性"
          - project_standards_compliance_validation: "验证与项目规范的一致性"  # 新增
        quality_gate_enforcement: true
        success_criteria: ["cookbook质量验证通过", "质量评分达标", "架构合规确认"]
        failure_action: "REQUIRE_QUALITY_IMPROVEMENT"

      # 系统架构师委派：工作流部署和结构验证
      - constraint_task: "architect_delegated_workflow_deployment"
        rule: "架构师委派技术负责人部署生成的工作流和相关模块"
        tool: "Write"  # 使用内置工具生成文件
        responsible_agent: "tech_lead"  # 委派给技术负责人
        delegated_by: "system_architect"
        deployment_approach: "pocketflow_architecture_compliant"
        deployment_targets: ["${OUTPUT_DIR}", "../../_shared/plugins/", "../../_shared/agents/roles/", "constraint-framework/"]
        deployment_validation:
          - "验证文件结构符合PocketFlow3.0规范"
          - "确认外部组件引用的正确性"
          - "验证角色定义和权限配置"
          - "检查约束框架集成"
          - "验证生成代码符合项目规范"  # 新增
          - "检查命名约定和代码风格一致性"  # 新增
        success_criteria: ["部署完成", "结构验证通过", "引用关系正确"]
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 系统架构师委派：质量反馈机制设置
      - constraint_task: "architect_delegated_quality_feedback_setup"
        rule: "架构师委派质量专家设置工作流质量反馈收集机制"
        tool: "Write"  # 使用内置工具创建反馈机制配置
        responsible_agent: "quality_expert"  # 委派给质量专家
        delegated_by: "system_architect"
        feedback_strategy: "cookbook_quality_tracking"
        feedback_channels: [
          "cookbook_pattern_adherence_metrics",
          "architectural_compliance_tracking",
          "user_satisfaction_with_generated_workflows",
          "workflow_execution_success_rates"
        ]
        quality_learning_integration: true
        success_criteria: ["质量反馈机制设置完成", "学习循环建立"]
        failure_action: "ESCALATE_TO_ARCHITECT"

      # 新增：项目规范一致性最终验证
      - constraint_task: "architect_led_project_standards_compliance_validation"
        rule: "架构师主导对生成工作流进行项目规范一致性最终验证"
        tool: "Task"  # 使用Task工具进行AI验证
        responsible_agent: "system_architect"
        validation_framework: "${ai_driven_project_standards_engine.core_use_cases_implementation.consistency_validation}"
        validation_scope:
          generated_workflow_compliance: "验证生成的工作流符合项目规范"
          code_generation_compliance: "验证代码生成遵循项目标准"
          template_adaptation_validation: "验证模板适配效果"
          naming_convention_compliance: "验证命名规范一致性"
        validation_inputs:
          project_standards_profile: "${ANALYSIS_CACHE}/project-standards-profile.json"
          generated_workflow: "${PLM_DIR}/generated/intelligent-workflow.yaml"
        validation_outputs:
          compliance_report: "${ANALYSIS_CACHE}/project-standards-compliance-report.md"
          deviation_analysis: "${ANALYSIS_CACHE}/standards-deviation-analysis.json"
          improvement_suggestions: "${ANALYSIS_CACHE}/standards-improvement-suggestions.md"
        success_criteria: ["规范一致性验证通过", "偏差分析完成", "改进建议生成"]
        failure_action: "REQUIRE_STANDARDS_ALIGNMENT"

      # 系统架构师主导：生成模式学习和优化
      - constraint_task: "architect_led_generation_pattern_learning"
        rule: "架构师主导基于本次生成过程更新cookbook质量生成模式"
        tool: "MultiEdit"  # 使用内置工具更新配置文件
        responsible_agent: "system_architect"
        learning_focus: "cookbook_quality_pattern_optimization"
        update_targets: [
          "cookbook_pattern_application_success_rates",
          "architectural_decision_effectiveness",
          "role_delegation_optimization_patterns",
          "quality_injection_rule_refinement",
          "project_standards_adaptation_effectiveness",  # 新增
          "standards_compliance_patterns"  # 新增
        ]
        pattern_reinforcement: true
        success_criteria: ["生成模式学习完成", "质量标准提升", "模式库更新"]
        failure_action: "MANUAL_PATTERN_ANALYSIS_REQUIRED"

    outputs: [
      "${OUTPUT_DIR}/intelligent-workflow-{timestamp}.yaml",
      "${OUTPUT_DIR}/comprehensive-usage-guide.md",
      "${PLM_DIR}/learning/updated-preferences.json"
    ]

# 配置
configuration:
  constraint_driven:
    enabled: true
    strict_enforcement: false

  execution:
    intelligent_mode: true
    adaptive_learning: true
    context_aware: true

  # 🤖 AI行为控制和执行路径严格约束
  ai_behavior_control:
    enabled: true
    control_level: "STRICT_ADHERENCE"
    deviation_tolerance: 0  # 零偏差容忍

    # AI执行路径强制约束
    execution_path_constraints:
      mandatory_sequence_adherence:
        description: "AI必须严格按照定义的阶段顺序执行"
        enforcement: "BLOCKING"
        violation_action: "ABORT_AND_RESTART_FROM_VALID_STAGE"

      resource_validation_mandatory:
        description: "AI必须在每个阶段验证资源可用性"
        enforcement: "PRE_STAGE_BLOCKING"
        violation_action: "FORCE_RESOURCE_VALIDATION"

      constraint_rule_compliance_mandatory:
        description: "AI必须遵守所有约束规则，不得绕过"
        enforcement: "CONTINUOUS_MONITORING"
        violation_action: "IMMEDIATE_ABORT"

      template_reference_validation_mandatory:
        description: "AI引用模板前必须验证存在性"
        enforcement: "PRE_REFERENCE_BLOCKING"
        violation_action: "REPLACE_WITH_VALIDATED_ALTERNATIVE"

      tool_usage_validation_mandatory:
        description: "AI使用工具前必须验证可用性"
        enforcement: "PRE_TOOL_USAGE_BLOCKING"
        violation_action: "USE_VERIFIED_ALTERNATIVE_TOOL"

    # AI创造性限制 - 防止随意发挥
    creativity_constraints:
      prohibit_fictional_resources:
        description: "禁止AI创造不存在的资源引用"
        enforcement: "STRICT_BLOCKING"
        detection_method: "RESOURCE_EXISTENCE_CHECK"
        violation_action: "ABORT_WITH_RESOURCE_ERROR"

      prohibit_undefined_tools:
        description: "禁止AI使用未定义或未验证的工具"
        enforcement: "STRICT_BLOCKING"
        detection_method: "TOOL_REGISTRY_CHECK"
        violation_action: "REPLACE_WITH_BUILTIN_TOOL"

      prohibit_architecture_violations:
        description: "禁止AI违反PocketFlow架构规范"
        enforcement: "STRICT_BLOCKING"
        detection_method: "ARCHITECTURE_COMPLIANCE_CHECK"
        violation_action: "ENFORCE_ARCHITECTURE_PATTERN"

      prohibit_invalid_role_assignments:
        description: "禁止AI分配不存在或无效的角色"
        enforcement: "STRICT_BLOCKING"
        detection_method: "ROLE_DEFINITION_VALIDATION"
        violation_action: "USE_DEFAULT_VALID_ROLES"

    # AI决策边界控制
    decision_boundary_control:
      template_selection_boundary:
        allowed_actions: ["SELECT_FROM_VERIFIED_TEMPLATES", "USE_EXISTING_TEMPLATES"]
        prohibited_actions: ["CREATE_FICTIONAL_TEMPLATES", "ASSUME_TEMPLATE_EXISTS"]
        boundary_enforcement: "STRICT"

      tool_selection_boundary:
        allowed_actions: ["USE_BUILTIN_TOOLS", "USE_VERIFIED_MCP_TOOLS"]
        prohibited_actions: ["ASSUME_EXTERNAL_TOOLS", "CREATE_FICTIONAL_TOOLS"]
        boundary_enforcement: "STRICT"

      role_assignment_boundary:
        allowed_actions: ["ASSIGN_DEFINED_ROLES", "USE_VALIDATED_COMBINATIONS"]
        prohibited_actions: ["CREATE_FICTIONAL_ROLES", "INVALID_COMBINATIONS"]
        boundary_enforcement: "STRICT"

      architecture_design_boundary:
        allowed_actions: ["APPLY_POCKETFLOW_PATTERNS", "USE_COOKBOOK_PATTERNS"]
        prohibited_actions: ["VIOLATE_ARCHITECTURE_RULES", "ARBITRARY_DESIGN_CHOICES"]
        boundary_enforcement: "STRICT"

  # 工作流生成器特定配置
  workflow_generator_features:
    enabled: true
    architecture_pattern_application: true    # 应用cookbook验证的架构模式
    intelligent_component_extraction: true    # 智能组件提取
    role_driven_design: true                  # 角色驱动设计
    pocketflow_compliance_validation: true    # PocketFlow架构合规验证
    project_standards_awareness: true         # 项目规范感知能力
    ai_driven_standards_inference: true       # AI驱动规范推断

  generation_configuration:
    default_analysis_depth: 3
    architecture_compliance_threshold: 0.9
    auto_component_extraction: true

  performance:
    analysis_timeout: "5m"
    generation_timeout: "3m"
    parallel_analysis: true
    cache_results: true

  quality:
    min_confidence_threshold: 0.7
    require_validation: true
    enable_optimization: true

  # 🎯 通用输出质量控制框架 - 新增
  universal_output_quality_framework:
    adaptive_quality_control:
      output_type_awareness: "根据输出类型调整质量标准"
      audience_adaptation: "根据目标受众调整内容层次"
      actionability_validation: "确保输出内容具备可执行性"
      consistency_enforcement: "确保跨工作流的一致性标准"

    quality_dimensions:
      content_completeness: "内容完整性"
      technical_accuracy: "技术准确性"
      business_relevance: "业务相关性"
      clarity_and_readability: "清晰度和可读性"
      actionable_guidance: "可执行指导价值"

    validation_mechanisms:
      automated_quality_checks: true
      stakeholder_validation: true
      consistency_verification: true
      improvement_suggestions: true

  # 业务导向工作流质量控制 - 简化版
  business_oriented_quality:
    enabled: true
    quality_dimensions:
      business_language_usage:
        weight: 0.3
        min_threshold: 0.9
        validation: "technical_jargon_detection"

      stakeholder_focus:
        weight: 0.25
        min_threshold: 0.85
        validation: "stakeholder_analysis_coverage"

      business_value_clarity:
        weight: 0.25
        min_threshold: 0.8
        validation: "roi_and_value_analysis_inclusion"

      abstraction_appropriateness:
        weight: 0.2
        min_threshold: 0.85
        validation: "abstraction_level_consistency"

    # 质量保证规则（基于intelligent-requirement-analysis-workflow经验抽象）
    quality_assurance_rules:
      # 基础业务导向规则
