# PocketFlow 3.0 智能工作流生成引擎 - 角色驱动版本
id: intelligent-workflow-generator
title: "智能工作流生成引擎"
version: "3.0-role-driven"
description: "基于系统架构师主导+专家委派模式的智能工作流生成系统，自动应用cookbook级别质量模式"

# 🎭 主导角色配置（角色驱动执行模式）
primary_role:
  role_id: "system_architect"
  role_name: "系统架构师"
  role_definition: "$ref: ../../_shared/agents/roles/system-architect.yaml"
  execution_mode: "autonomous_workflow_generation"
  authority_level: "WORKFLOW_ARCHITECT"

  # 角色能力集成（自动调用其他角色的专业能力）
  integrated_capabilities:
    technical_validation: "自动调用tech_lead能力进行技术验证"
    requirement_analysis: "自动调用business_analyst能力进行需求分析"
    quality_assurance: "自动调用quality_expert能力进行质量保证"
    role_selection: "自动调用智能角色选择引擎"
    industry_knowledge: "自动调用行业知识匹配能力"
    project_standards_inference: "自动调用AI项目规范推断能力"  # 新增

  # 自动化执行配置
  autonomous_execution:
    auto_analysis: true
    auto_workflow_generation: true
    auto_quality_injection: true
    auto_project_standards_inference: true  # 新增：自动项目规范推断
    user_intervention_points: ["requirement_confirmation", "architecture_decision_validation", "final_review"]

# 后台支持角色（不直接暴露给用户）
background_roles:
  - role_id: "tech_lead"
    usage: "technical_validation_capability"
    role_definition: "$ref: ../../_shared/agents/roles/tech-lead.yaml"
  - role_id: "business_analyst"
    usage: "requirement_analysis_capability"
    role_definition: "$ref: ../../_shared/agents/roles/business-analyst.yaml"
  - role_id: "quality_expert"
    usage: "quality_assurance_capability"
    role_definition: "$ref: ../../_shared/agents/roles/quality-expert.yaml"
  - role_id: "senior_engineer"
    usage: "implementation_guidance_capability"
    role_definition: "$ref: ../../_shared/agents/roles/senior-engineer.yaml"

# 🎯 目标用户群体定义
target_audience:
  primary_users:
    - role: "开发团队负责人"
      expectations: ["快速工作流生成", "架构合规保证", "质量标准统一"]
    - role: "项目经理"
      expectations: ["标准化流程", "风险控制", "效率提升"]
    - role: "技术负责人"
      expectations: ["技术方案验证", "实施指导", "质量把关"]

  secondary_users:
    - role: "业务分析师"
      expectations: ["需求理解支持", "业务价值分析", "干系人管理"]
    - role: "质量工程师"
      expectations: ["质量标准应用", "测试策略制定", "合规性保证"]

# 约束驱动配置
constraint_driven_config:
  execution_path_control:
    strict_sequence: true
    prevent_backtrack: false
    state_lock_enforcement: true
    dependency_chain_validation: true
  constraint_priority: ["PROHIBIT", "REQUIRE", "ALLOW"]

  # 🚫 强制约束执行机制 - 防止AI随意发挥
  mandatory_constraint_enforcement:
    enabled: true
    enforcement_level: "BLOCKING"  # 阻断级别执行
    violation_handling: "ABORT_GENERATION"  # 违规时中止生成

    # 核心约束规则 - 必须严格遵守
    core_constraints:
      # 工具使用约束
      tool_usage_constraints:
        - rule: "PROHIBIT_UNDEFINED_MCP_TOOLS"
          description: "禁止使用未经验证的MCP工具"
          enforcement: "pre_generation_validation"
          violation_action: "REPLACE_WITH_BUILTIN_TOOLS"

        - rule: "REQUIRE_TOOL_AVAILABILITY_CHECK"
          description: "强制检查工具可用性"
          enforcement: "mandatory_validation"
          failure_action: "ABORT_TASK_GENERATION"

        - rule: "PROHIBIT_EXTERNAL_TOOL_ASSUMPTIONS"
          description: "禁止假设外部工具存在"
          enforcement: "pre_task_validation"
          violation_action: "USE_VERIFIED_ALTERNATIVES"

      # 模板引用约束
      template_reference_constraints:
        - rule: "REQUIRE_TEMPLATE_EXISTENCE_VALIDATION"
          description: "强制验证模板文件存在性"
          enforcement: "pre_reference_check"
          failure_action: "REMOVE_INVALID_REFERENCES"

        - rule: "PROHIBIT_FICTIONAL_TEMPLATES"
          description: "禁止引用虚构的模板文件"
          enforcement: "strict_path_validation"
          violation_action: "ABORT_GENERATION"

        - rule: "REQUIRE_TEMPLATE_DIRECTORY_SCAN"
          description: "强制扫描实际模板目录"
          enforcement: "mandatory_discovery_phase"
          failure_action: "USE_AVAILABLE_TEMPLATES_ONLY"

      # 角色分配约束
      role_assignment_constraints:
        - rule: "REQUIRE_ROLE_DEFINITION_VALIDATION"
          description: "强制验证角色定义存在"
          enforcement: "pre_assignment_check"
          failure_action: "USE_DEFAULT_ROLES"

        - rule: "PROHIBIT_INVALID_ROLE_COMBINATIONS"
          description: "禁止无效的角色组合"
          enforcement: "combination_validation"
          violation_action: "APPLY_VALID_COMBINATIONS"

        - rule: "REQUIRE_AUTHORITY_HIERARCHY_VALIDATION"
          description: "强制验证权威层次合理性"
          enforcement: "hierarchy_check"
          failure_action: "APPLY_DEFAULT_HIERARCHY"

      # 架构合规约束
      architecture_compliance_constraints:
        - rule: "REQUIRE_POCKETFLOW_ARCHITECTURE_COMPLIANCE"
          description: "强制遵循PocketFlow 3.0架构规范"
          enforcement: "structural_validation"
          failure_action: "ENFORCE_ARCHITECTURE_PATTERNS"

        - rule: "PROHIBIT_ARCHITECTURE_VIOLATIONS"
          description: "禁止违反架构规范的设计"
          enforcement: "design_validation"
          violation_action: "ABORT_GENERATION"

        - rule: "REQUIRE_COMPONENT_SEPARATION_VALIDATION"
          description: "强制验证组件分离符合规范"
          enforcement: "separation_check"
          failure_action: "APPLY_STANDARD_SEPARATION"

# 依赖 - 基于真实可用资源
requires:
  # 插件动态发现配置 - 扫描 _shared/plugins/ 目录下所有 *-domain 插件
  plugins_discovery:
    enabled: true
    scan_directory: "../../_shared/plugins/"
    pattern: "*-domain"
    auto_detect: true

  # 重要：基于实际可用的MCP工具和内置工具
  available_builtin_tools: [
    "Read", "Write", "Edit", "MultiEdit", "Grep", "Glob", "LS", "Bash"
  ]

  # 动态MCP工具发现配置 - 扫描integrations文件夹
  dynamic_mcp_discovery:
    integrations_directory: "../../_shared/core/integrations/"
    discovery_strategy: "scan_and_parse_integration_docs"
    supported_formats: [".md", ".yaml", ".yml", ".json"]
    auto_refresh: true
    cache_duration: "1h"

  # 资源验证要求
  resource_validation_required: true
  template_existence_check: true
  plugin_availability_check: true

  # 🔒 强制验证和阻断机制
  mandatory_validation_and_blocking:
    enabled: true
    validation_mode: "STRICT_BLOCKING"
    failure_tolerance: 0  # 零容忍失败

    # 预执行验证检查点
    pre_execution_checkpoints:
      checkpoint_1_resource_discovery:
        validation_target: "available_resources"
        required_validations:
          - "scan_actual_template_directories"
          - "verify_plugin_definitions_exist"
          - "validate_mcp_tool_availability"
          - "check_role_definition_files"
        blocking_condition: "any_validation_fails"
        failure_action: "ABORT_WITH_RESOURCE_REPORT"

      checkpoint_2_constraint_validation:
        validation_target: "constraint_rules"
        required_validations:
          - "validate_tool_usage_rules"
          - "check_template_reference_rules"
          - "verify_role_assignment_rules"
          - "validate_architecture_compliance_rules"
        blocking_condition: "constraint_violation_detected"
        failure_action: "ABORT_WITH_CONSTRAINT_REPORT"

      checkpoint_3_dependency_validation:
        validation_target: "workflow_dependencies"
        required_validations:
          - "validate_stage_dependencies"
          - "check_role_dependency_chains"
          - "verify_resource_dependency_availability"
          - "validate_execution_sequence"
        blocking_condition: "dependency_chain_broken"
        failure_action: "ABORT_WITH_DEPENDENCY_REPORT"

    # 执行中验证检查点
    runtime_validation_checkpoints:
      checkpoint_task_generation:
        validation_target: "generated_tasks"
        required_validations:
          - "validate_tool_references_exist"
          - "check_template_paths_valid"
          - "verify_role_assignments_valid"
          - "validate_constraint_compliance"
        blocking_condition: "invalid_task_detected"
        failure_action: "FIX_OR_ABORT_TASK"

      checkpoint_workflow_assembly:
        validation_target: "assembled_workflow"
        required_validations:
          - "validate_workflow_structure_compliance"
          - "check_all_references_resolvable"
          - "verify_execution_path_valid"
          - "validate_quality_standards_met"
        blocking_condition: "workflow_integrity_compromised"
        failure_action: "ABORT_WITH_ASSEMBLY_REPORT"

    # 后验证检查点
    post_generation_checkpoints:
      checkpoint_final_validation:
        validation_target: "final_workflow"
        required_validations:
          - "validate_all_external_references"
          - "check_cookbook_pattern_compliance"
          - "verify_architecture_standards_met"
          - "validate_execution_feasibility"
        blocking_condition: "final_validation_fails"
        failure_action: "ABORT_WITH_COMPREHENSIVE_REPORT"
  external_apis:
    - openai_gpt4  # 深度语义理解
    - anthropic_claude  # 逻辑推理分析
    - github_copilot  # 代码模式识别

  # 资源发现和验证引擎 - 基于PocketFlow 3.0实际能力
  resource_discovery_validation_engine:
    # 🔍 强制资源扫描和验证
    mandatory_resource_scanning:
      enabled: true
      scan_mode: "COMPREHENSIVE_STRICT"
      validation_required: true
      cache_validation_results: true

    template_discovery:
      scan_directories: ["../../_shared/plugins/*/templates/", "templates/"]
      supported_formats: [".mdc", ".yaml", ".yml", ".md"]
      auto_cataloging: true
      # 新增：强制验证机制
      mandatory_validation:
        verify_file_existence: true
        check_file_readability: true
        validate_template_syntax: true
        catalog_template_capabilities: true
        failure_handling: "EXCLUDE_INVALID_TEMPLATES"

    plugin_capability_detection:
      scan_plugin_directories: true
      extract_plugin_definitions: true
      validate_plugin_dependencies: true
      # 新增：强制插件验证
      mandatory_plugin_validation:
        verify_plugin_yaml_exists: true
        validate_plugin_structure: true
        check_template_directory_exists: true
        verify_plugin_dependencies_resolvable: true
        failure_handling: "EXCLUDE_INVALID_PLUGINS"

    mcp_tool_capability_verification:
      # PocketFlow 3.0 实际MCP工具验证
      xmind_analysis_integration_check: true  # 验证XMind分析工具集
      external_mcp_tools_check: false  # 不假设外部MCP工具存在
      fallback_strategy_required: true
      # 新增：MCP工具强制验证
      mandatory_mcp_validation:
        verify_integration_docs_exist: true
        validate_tool_definitions: true
        check_tool_accessibility: true
        test_tool_basic_functionality: false  # 不执行实际测试
        failure_handling: "USE_BUILTIN_ALTERNATIVES"

      # 智能工具选择策略
      tool_selection_priority:
        1: "task_master_tools"  # 优先使用Task-Master专业工具
        2: "xmind_analysis_tools"  # 其次使用XMind分析工具
        3: "available_builtin_tools"  # 最后使用内置工具

      # 新增：工具可用性强制检查矩阵
      tool_availability_enforcement_matrix:
        builtin_tools_always_available: ["Read", "Write", "Edit", "MultiEdit", "Grep", "Glob", "LS", "Bash", "Task"]
        mcp_tools_require_verification: ["task_master.*", "xmind_analysis.*"]
        external_tools_prohibited: ["undefined_mcp.*", "fictional_tools.*"]
        fallback_mapping_required: true
        violation_handling: "ABORT_AND_REPORT"

# 变量
variables:
  PLM_DIR: "PLM-${git_branch_normalized}"
  OUTPUT_DIR: "workflows/user-workflows"
  PROJECT_ROOT: "${cwd}"
  ANALYSIS_CACHE: "${PLM_DIR}/analysis-cache"

# 🤖 AI驱动项目规范感知引擎
ai_driven_project_standards_engine:
  description: "利用AI能力自动推断项目规范，指导工作流生成和代码生成"

  # AI规范推断核心
  ai_standards_inference:
    approach: "semantic_analysis_with_pattern_recognition"
    supported_languages: ["java", "javascript", "python", "php"]

    # AI语义分析配置
    semantic_analysis:
      analysis_prompt_template: |
        分析以下项目代码样本，推断项目的核心规范：
        
        项目文件结构: {project_structure}
        代码样本: {code_samples}
        配置文件: {config_files}
        
        请从以下维度分析项目规范：
        1. 命名规范 (类、方法、变量、文件)
        2. 代码组织规范 (包结构、模块划分、分层架构、命名空间)
        3. 质量标准 (复杂度、测试、文档)
        4. 技术偏好 (框架选择、设计模式、工具链、依赖管理)
        5. 团队协作规范 (代码风格、提交规范、分支策略)
        
        特别关注以下语言特定模式：
        - Java: Maven/Gradle配置、Spring框架使用、包命名约定
        - JavaScript/TypeScript: npm配置、模块系统、框架选择
        - Python: pip配置、包结构、虚拟环境使用
        - PHP: Composer配置、PSR标准遵循、框架使用模式
        
        输出结构化的项目规范画像JSON。

    # 样本采集策略
    intelligent_sampling:
      sampling_algorithm: "representative_diversity_sampling"
      sample_targets:
        code_files:
          max_samples: 20
          selection_criteria: "diversity_and_representativeness"
          file_types: ["*.java", "*.js", "*.py", "*.ts", "*.php"]

        config_files:
          priority_files: ["package.json", "pom.xml", "requirements.txt", "tsconfig.json", "composer.json"]
          build_configs: ["webpack.config.js", "build.gradle", "setup.py", "composer.lock"]

        project_structure:
          scan_depth: 3
          focus_directories: ["src/", "lib/", "app/", "components/", "services/", "public/", "resources/", "config/"]

  # 规范画像构建
  standards_profile_construction:
    # 核心规范维度
    naming_conventions:
      inference_method: "pattern_frequency_analysis"
      confidence_threshold: 0.7

    code_organization:
      inference_method: "structural_pattern_recognition"
      focus_areas: ["layering", "modularity", "separation_of_concerns"]

    quality_standards:
      inference_method: "threshold_pattern_analysis"
      metrics: ["complexity", "coverage", "documentation_density"]

    technology_preferences:
      inference_method: "usage_pattern_analysis"
      categories: ["frameworks", "libraries", "tools", "patterns"]

    team_collaboration:
      inference_method: "workflow_pattern_detection"
      indicators: ["commit_patterns", "branch_naming", "pr_conventions"]

    # AI增强分析
    ai_enhanced_analysis:
      context_enrichment: "利用AI理解项目业务上下文"
      pattern_explanation: "AI解释识别到的规范模式的合理性"
      evolution_prediction: "预测项目规范的可能演进方向"
      adaptation_suggestions: "建议PocketFlow如何适配这些规范"

  # 规范应用策略
  standards_application_strategy:
    # 工作流约束调整
    workflow_constraint_adaptation:
      constraint_mapping:
        naming_standards: "调整代码生成的命名约束"
        quality_thresholds: "调整质量门禁标准"
        architectural_constraints: "应用架构规范约束"

      adaptation_rules:
        - rule: "项目使用驼峰命名 → 生成代码使用驼峰命名"
        - rule: "项目有严格测试覆盖率 → 工作流强制测试要求"
        - rule: "项目使用特定框架 → 选择兼容的工具和模板"

    # 模板智能选择
    template_intelligent_selection:
      selection_algorithm: "standards_compatibility_scoring"
      template_adaptation:
        code_templates: "基于项目代码风格调整代码模板"
        documentation_templates: "匹配项目文档格式和风格"
        test_templates: "适配项目测试框架和模式"

    # 领域划分优化
    domain_classification_enhancement:
      domain_inference:
        business_domain: "从代码和项目结构推断业务领域"
        technical_domain: "识别技术领域和架构特征"
        team_culture: "推断团队文化和协作偏好"

      domain_specific_adaptation:
        constraint_specialization: "基于领域特征专门化约束规则"
        workflow_customization: "为特定领域定制工作流模式"
        tool_selection: "选择领域适配的工具和实践"

  # 规范感知输出格式
  project_standards_profile_format:
    structure: |
      {
        "project_identity": {
          "domain": "推断的业务领域",
          "technology_stack": "主要技术栈",
          "project_scale": "项目规模评估",
          "team_maturity": "团队成熟度评估"
        },
        "naming_conventions": {
          "classes": "类命名模式",
          "methods": "方法命名模式", 
          "variables": "变量命名模式",
          "files": "文件命名模式",
          "confidence": "推断置信度"
        },
        "code_organization": {
          "package_structure": "包结构模式",
          "layering_approach": "分层架构方式",
          "module_boundaries": "模块边界定义",
          "dependency_management": "依赖管理方式"
        },
        "quality_standards": {
          "complexity_thresholds": "复杂度标准",
          "testing_expectations": "测试要求",
          "documentation_standards": "文档标准",
          "code_review_practices": "代码审查实践"
        },
        "technology_preferences": {
          "preferred_frameworks": "偏好的框架",
          "common_patterns": "常用设计模式",
          "toolchain": "工具链选择",
          "integration_approaches": "集成方式"
        },
        "adaptation_strategy": {
          "constraint_adjustments": "约束调整建议",
          "template_selections": "模板选择建议",
          "workflow_customizations": "工作流定制建议",
          "code_generation_rules": "代码生成规则"
        }
      }

  # 四大核心使用场景实现
  core_use_cases_implementation:
    # 场景1：新团队成员快速了解项目规范
    team_onboarding:
      capability: "自动生成项目规范指南"
      implementation: "基于规范画像生成可读的规范文档"
      output: "项目规范快速入门指南"

    # 场景2：自动生成符合项目风格的代码
    code_generation_compliance:
      capability: "代码生成遵循项目规范"
      implementation: "将规范画像应用到代码生成模板"
      validation: "生成后自动检查规范一致性"

    # 场景3：工作流模板的智能适配
    workflow_template_adaptation:
      capability: "智能选择和调整工作流模板"
      implementation: "基于项目规范匹配最合适的工作流模式"
      customization: "动态调整模板参数和约束"

    # 场景4：项目规范一致性检查
    consistency_validation:
      capability: "检查工作流输出与项目规范的一致性"
      implementation: "对比生成结果与项目规范画像"
      feedback: "提供规范偏差报告和改进建议"

# 🎭 智能角色选择引擎
intelligent_role_selection_engine:
  # 角色发现和分析
  role_discovery:
    roles_directory: "../../_shared/agents/roles/"
    file_pattern: "*.yaml"
    auto_scan: true
    cache_duration: "1h"

  # 角色匹配策略
  role_matching_strategy:
    matching_algorithm: "semantic_analysis + capability_matching + workflow_context"

    # 工作流类型与角色的匹配模式
    workflow_type_mapping:
      development:
        required_roles: ["tech_lead", "senior_engineer"]
        optional_roles: ["quality_expert", "sdet"]
        role_priority: ["technical_leadership", "technical_implementation"]

      architecture_design:
        required_roles: ["system_architect", "tech_lead"]
        optional_roles: ["security_expert", "performance_expert"]
        role_priority: ["architecture_authority", "strategic_authority"]

      quality_assurance:
        required_roles: ["quality_expert", "sdet"]
        optional_roles: ["senior_engineer", "performance_expert"]
        role_priority: ["quality_authority", "test_specialist"]

      security_review:
        required_roles: ["security_expert", "tech_lead"]
        optional_roles: ["quality_expert", "system_architect"]
        role_priority: ["security_authority", "strategic_authority"]

      requirements_analysis:
        required_roles: ["business_analyst", "product_owner", "system_architect"]
        optional_roles: ["tech_lead", "quality_expert"]
        role_priority: ["business_requirement_analysis", "business_authority", "architecture_authority"]

      performance_optimization:
        required_roles: ["performance_expert", "senior_engineer"]
        optional_roles: ["system_architect", "sdet"]
        role_priority: ["performance_authority", "implementation_expert"]

    # 关键词匹配规则
    keyword_matching_rules:
      technical_keywords:
        implementation: ["senior_engineer", "tech_lead"]
        architecture: ["system_architect", "tech_lead"]
        security: ["security_expert", "quality_expert"]
        testing: ["sdet", "quality_expert"]
        performance: ["performance_expert", "senior_engineer"]
        requirements: ["business_analyst", "product_owner", "system_architect"]
        quality: ["quality_expert", "sdet"]
        leadership: ["tech_lead", "system_architect"]

      domain_keywords:
        # 通用领域关键词，由具体工作流自定义
        security_critical: ["security_expert", "quality_expert"]
        performance_critical: ["performance_expert", "quality_expert"]
        architecture_intensive: ["system_architect", "tech_lead"]
        business_focused: ["business_analyst", "product_owner"]

    # 协作关系优化
    collaboration_optimization:
      enable_collaboration_analysis: true
      preferred_combinations:
        - ["tech_lead", "senior_engineer", "quality_expert"]  # 开发三角
        - ["system_architect", "security_expert", "tech_lead"]  # 架构三角
        - ["product_owner", "system_architect", "tech_lead"]  # 需求三角
        - ["quality_expert", "sdet", "performance_expert"]  # 质量三角

      avoid_combinations:
        - ["product_owner", "sdet"]  # 业务与测试直接协作较少

  # 角色选择算法
  role_selection_algorithm:
    selection_method: "multi_criteria_scoring"

    # 评分权重配置
    scoring_weights:
      workflow_context_match: 0.35      # 工作流上下文匹配
      keyword_relevance: 0.25           # 关键词相关性
      collaboration_synergy: 0.20       # 协作协同效应
      authority_alignment: 0.15         # 权限对齐度
      specialization_depth: 0.05        # 专业化深度

    # 选择阈值
    selection_thresholds:
      required_role_threshold: 0.8      # 必需角色阈值
      optional_role_threshold: 0.6      # 可选角色阈值
      max_roles_per_workflow: 6         # 每个工作流最大角色数
      min_roles_per_workflow: 2         # 每个工作流最小角色数

    # 角色选择优先级规则
    priority_rules:
      always_include_tech_lead: true    # 总是包含技术负责人
      balance_authority_levels: true    # 平衡权限级别
      ensure_quality_coverage: true     # 确保质量覆盖
      avoid_role_redundancy: true       # 避免角色冗余

  # 角色覆盖验证机制
  role_coverage_validation:
    expected_roles: [
      "tech_lead", "senior_engineer", "quality_expert", "security_expert",
      "sdet", "system_architect", "product_owner", "performance_expert", "business_analyst"
    ]
    coverage_checks:
      workflow_type_coverage: "验证每种工作流类型都有对应的角色映射"
      keyword_coverage: "验证每个技术关键词都有对应的角色"
      collaboration_coverage: "验证所有角色都有定义的协作关系"
      authority_coverage: "验证权限级别分布合理"

    validation_rules:
      - "所有expected_roles必须在workflow_type_mapping中出现"
      - "所有expected_roles必须在keyword_matching_rules中被引用"
      - "所有preferred_combinations必须使用expected_roles中的角色"
      - "新增角色文件时自动更新expected_roles列表"

# 🧠 综合智能分析引擎
intelligent_analysis_engine:
  # 多维度分析架构
  analysis_dimensions:
    - semantic_understanding    # 语义理解维度
    - codebase_context         # 代码库上下文维度
    - capability_assessment    # 能力评估维度
    - industry_alignment      # 行业对齐维度
    - user_preference_learning # 用户偏好学习维度
    - progressive_refinement   # 渐进式细化维度
    - interactive_guidance     # 交互式引导维度
    - risk_exposure           # 风险暴露维度

  # 🎯 语义理解引擎
  semantic_understanding_engine:
    llm_integration:
      primary_model: "openai_gpt4"
      fallback_model: "anthropic_claude"

    analysis_prompts:
      intent_extraction: |
        分析以下用户需求，提取核心意图：
        用户输入: "{user_input}"
        项目信息: "{project_context}"
        
        请从以下维度分析：
        1. 业务目标 - 用户想要解决什么业务问题？
        2. 技术需求 - 涉及哪些技术栈和工具？
        3. 质量要求 - 对质量、性能、安全有什么期望？
        4. 流程偏好 - 倾向于什么样的工作方式？
        5. 约束条件 - 有什么限制或特殊要求？
        
        输出JSON格式的结构化分析结果。

      context_enrichment: |
        基于项目代码库上下文，丰富用户需求理解：
        代码库信息: "{codebase_analysis}"
        用户原始需求: "{user_input}"
        初步意图分析: "{intent_analysis}"
        
        请补充和完善：
        - 技术栈相关的特殊考虑
        - 项目架构约束
        - 现有工作流模式
        - 团队协作习惯推测

      industry_contextualization: |
        结合行业最佳实践，评估需求的合理性和完整性：
        用户需求: "{enriched_intent}"
        行业类型: "{detected_industry}"
        
        分析：
        - 是否符合行业标准实践？
        - 缺少哪些关键环节？
        - 有什么潜在风险？
        - 推荐哪些改进？

    output_format:
      intent_confidence: "0.0-1.0"
      business_context: "structured_analysis"
      technical_requirements: "detailed_specs"
      quality_expectations: "measurable_criteria"
      risk_assessment: "identified_risks"
      improvement_suggestions: "actionable_recommendations"

  # 📊 代码库智能分析引擎
  codebase_analysis_engine:
    scanning_strategies:
      # 快速扫描 - 项目基础信息
      quick_scan:
        enabled: true
        timeout: "30s"
        targets:
          - package_managers: ["pom.xml", "package.json", "requirements.txt", "Cargo.toml"]
          - config_files: [".gitignore", "dockerfile", "docker-compose.yml"]
          - documentation: ["README.md", "CHANGELOG.md", "API.md"]
          - ci_cd: [".github/workflows", ".gitlab-ci.yml", "jenkins"]

      # 深度分析 - 架构模式识别
      deep_analysis:
        enabled: true
        timeout: "2m"
        analysis_types:
          - architecture_patterns: "识别MVC、微服务、单体等架构模式"
          - technology_stack: "分析主要技术栈和框架"
          - testing_patterns: "识别测试策略和覆盖度"
          - deployment_patterns: "分析部署和CI/CD模式"
          - security_patterns: "识别安全相关配置和实践"

      # 工作流模式学习
      workflow_pattern_learning:
        enabled: true
        learning_sources:
          - existing_workflows: "扫描现有工作流文件"
          - git_history: "分析提交模式和分支策略"
          - issue_patterns: "学习问题处理模式"
          - pr_patterns: "分析代码审查习惯"

    pattern_recognition:
      # 技术栈模式识别
      tech_stack_patterns:
        java_spring:
          indicators: ["pom.xml", "spring-boot", "maven"]
          typical_workflows: ["tdd_junit", "spring_security_audit", "maven_deployment"]
          constraints: ["no_compile_in_test", "spring_profile_aware"]

        node_express:
          indicators: ["package.json", "express", "npm"]
          typical_workflows: ["jest_testing", "npm_security_audit", "docker_deployment"]
          constraints: ["node_modules_ignore", "env_config_required"]

        python_django:
          indicators: ["requirements.txt", "django", "pip"]
          typical_workflows: ["pytest_coverage", "django_migrations", "gunicorn_deployment"]
          constraints: ["virtual_env_required", "settings_security"]

      # 团队协作模式识别
      collaboration_patterns:
        git_flow:
          indicators: ["develop", "release/", "hotfix/"]
          suggested_workflows: ["feature_branch_workflow", "release_management"]

        github_flow:
          indicators: ["main", "short_lived_branches"]
          suggested_workflows: ["continuous_deployment", "automated_testing"]

        trunk_based:
          indicators: ["main", "feature_flags"]
          suggested_workflows: ["continuous_integration", "feature_toggle_management"]

  # 🔍 通用代码感知分析引擎 - 新增
  universal_code_awareness_engine:
    adaptive_analysis:
      context_driven_scanning: "根据工作流上下文调整扫描深度"
      business_semantic_extraction: "通用业务语义提取"
      entity_relationship_discovery: "自动发现实体关系"
      cross_language_support: "支持多编程语言"

    analysis_capabilities:
      business_entity_identification: true
      dependency_impact_analysis: true
      modification_complexity_assessment: true
      semantic_clustering: true
      chinese_annotation_support: true

    integration_patterns:
      code_first_workflow_support: "支持代码优先工作流"
      interactive_questioning_enhancement: "增强交互式问题生成"
      business_technical_bridge: "业务技术桥接能力"

  # 🎯 能力匹配和缺口分析引擎
  capability_assessment_engine:
    # PocketFlow现有能力盘点
    current_capabilities_inventory:
      plugins_analysis:
        - scan_existing_plugins: true
        - assess_plugin_coverage: true
        - identify_plugin_dependencies: true

      agents_analysis:
        - evaluate_agent_capabilities: true
        - assess_collaboration_patterns: true
        - identify_skill_gaps: true

      templates_analysis:
        - catalog_existing_templates: true
        - assess_template_quality: true
        - identify_reusable_patterns: true

    # 需求与能力匹配
    requirement_capability_matching:
      matching_algorithm: "semantic_similarity + rule_based"

      matching_criteria:
        functional_match:
          weight: 0.4
          factors: ["input_compatibility", "output_alignment", "process_similarity"]

        technical_match:
          weight: 0.3
          factors: ["tech_stack_support", "tool_compatibility", "integration_ease"]

        quality_match:
          weight: 0.2
          factors: ["quality_standards", "testing_coverage", "security_compliance"]

        context_match:
          weight: 0.1
          factors: ["team_size_fit", "complexity_alignment", "timeline_realistic"]

    # 能力缺口识别和扩展
    capability_gap_analysis:
      gap_detection:
        method: "requirement_coverage_analysis"
        threshold: 0.7  # 覆盖度低于70%认为存在缺口

      gap_categories:
        missing_plugins:
          detection: "required_domain_not_covered"
          solution: "generate_custom_plugin"

        insufficient_agents:
          detection: "required_expertise_not_available"
          solution: "create_specialized_agent"

        missing_templates:
          detection: "workflow_pattern_not_supported"
          solution: "generate_custom_template"

        integration_gaps:
          detection: "tool_chain_incomplete"
          solution: "create_integration_bridge"

    # 自动能力扩展
    automatic_capability_extension:
      enabled: true
      extension_strategies:
        - plugin_generation: "基于需求自动生成领域插件"
        - agent_specialization: "创建专门的代理角色"
        - template_synthesis: "合成新的工作流模板"
        - integration_creation: "建立工具集成桥梁"

  # 🏗️ PocketFlow 3.0 架构引擎
  pocketflow_architecture_engine:
    # 架构目录映射
    architecture_directory_mapping:
      plugins_system:
        path: "../../_shared/plugins/"
        purpose: "5个领域特定知识包"
        # 组件和模板位置采用动态发现模式
        discovery_mode:
          components_pattern: "../../_shared/plugins/*-domain/"
          templates_pattern: "../../_shared/plugins/*-domain/templates/"
          auto_scan: true
          validation: "verify_directory_exists"

      core_system:
        path: "../../_shared/core/"
        purpose: "多代理协调引擎和集成系统"

      constraint_framework:
        path: "constraint-framework/"
        purpose: "4层约束继承系统"

      agents_system:
        path: "agents/"
        purpose: "8个专门代理角色定义"

      quality_gates:
        path: "quality-gates/"
        purpose: "客观90%阈值质量标准"

      workflows:
        path: "workflows/"
        purpose: "企业模板和cookbook食谱"

      knowledge:
        path: "knowledge/"
        purpose: "技术标准和业务知识"

    # 工作流分解策略
    workflow_decomposition_strategy:
      component_identification:
        - identify_domain_requirements: "识别领域特定需求"
        - determine_template_needs: "确定模板生成需求"
        - assess_agent_role_requirements: "评估代理角色需求"
        - evaluate_quality_gate_needs: "评估质量门禁需求"
        - analyze_constraint_requirements: "分析约束需求"

    # 文件组织策略
    file_organization_strategy:
      template_first_approach: "优先生成模板文件"
      domain_specific_placement: "按领域特定放置文件"
      component_separation: "实现配置与实现分离"
      architecture_compliance: "符合PocketFlow 3.0架构规范"

  # 📄 模板驱动报告生成引擎
  template_driven_report_engine:
